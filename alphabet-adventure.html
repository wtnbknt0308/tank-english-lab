/* ===== SPEECH ===== */
function speak(text) {
  if (!('speechSynthesis' in window)) return;
  const t = text.length === 1 ? text.toLowerCase() : text;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  u.lang = 'en-US'; u.rate = 0.85;
  window.speechSynthesis.speak(u);
}

/* ===== TYPING SESSION ===== */
function TypingSession({ category, onFinish }) {
  const words = TYPING[category];
  const [idx, setIdx] = useState(0);
  const [input, setInput] = useState('');
  const [t0, setT0] = useState(null);
  const [done, setDone] = useState(false);
  const [result, setResult] = useState({});
  const [mistakes, setMistakes] = useState(new Set());
  const [flash, setFlash] = useState(false);
  const [blink, setBlink] = useState(true);
  const ref = useRef(null);
  const cur = words[idx].word.toLowerCase();

  useEffect(() => { ref.current?.focus(); if (!done) speak(words[idx].word); }, [idx, done]);
  useEffect(() => { const t = setInterval(()=>setBlink(b=>!b),500); return ()=>clearInterval(t); }, []);

  const onInput = e => {
    const val = e.target.value;
    if (!t0) setT0(Date.now());
    if (val.length > input.length) {
      const typed = val[val.length-1], exp = cur[val.length-1];
      if (typed === exp) {
        setInput(val);
        if (val === cur) {
          if (idx === words.length-1) {
            const dur = (Date.now()-t0)/1000;
            const chars = words.reduce((a,w)=>a+w.word.length,0);
            const wpm = Math.round((chars/5)/(dur/60));
            setResult({wpm,time:dur.toFixed(1),mistakes:Array.from(mistakes)});
            setDone(true); onFinish(wpm,dur,mistakes.size);
          } else { setTimeout(()=>{setIdx(i=>i+1);setInput('');},100); }
        }
      } else { setMistakes(p=>new Set(p).add(exp)); setFlash(true); setTimeout(()=>setFlash(false),350); }
    } else { setInput(val); }
  };

  const hint = (ch) => {
    if (!ch) return null;
    const c = ch.toLowerCase();
    if ('1qaz'.includes(c)) return {f:'L-Pinky',l:'左小指'};
    if ('2wsx'.includes(c)) return {f:'L-Ring',l:'左薬指'};
    if ('3edc'.includes(c)) return {f:'L-Middle',l:'左中指'};
    if ('4rfv5tgb'.includes(c)) return {f:'L-Index',l:'左人差指'};
    if ('6yhn7ujm'.includes(c)) return {f:'R-Index',l:'右人差指'};
    if ('8ik,'.includes(c)) return {f:'R-Middle',l:'右中指'};
    if ('9ol.'.includes(c)) return {f:'R-Ring',l:'右薬指'};
    if ('0p;/-='.includes(c)) return {f:'R-Pinky',l:'右小指'};
    return null;
  };

/* ===== PRONUNCIATION LAB ===== */
function PronounLab({ prog, onListen }) {
  const [sel, setSel] = useState(null);
  const [rec, setRec] = useState(false);
  const [audio, setAudio] = useState(null);
  const mr = useRef(null); const ch = useRef([]);

  const toggle = async () => {
    if (rec) { mr.current?.stop(); setRec(false); }
    else {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({audio:true});
        const types = ['audio/webm','audio/ogg','audio/mp4','audio/wav'];
        const mime = types.find(t=>MediaRecorder.isTypeSupported(t));
        mr.current = new MediaRecorder(stream, mime?{mimeType:mime}:{});
        mr.current.ondataavailable = e=>ch.current.push(e.data);
        mr.current.onstop = ()=>{ setAudio(new Blob(ch.current,{type:mime||'audio/webm'})); ch.current=[]; };
        mr.current.start(); setRec(true);
      } catch(e) { alert('マイクへのアクセスを許可してください'); }
    }
  };

  return (
    <div style={{height:'100%',display:'flex',flexDirection:'column'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'1.25rem',flexWrap:'wrap',gap:'0.5rem'}}>
        <h2 style={{fontSize:'1.4rem',fontWeight:900,color:'#4f46e5'}}>ハロー・ラボ</h2>
        <span style={{background:'#eef2ff',color:'#4f46e5',fontWeight:700,padding:'0.4rem 1rem',borderRadius:'9999px',border:'2px solid #e0e7ff',fontSize:'0.8rem'}}>自己紹介に使える表現を覚えよう</span>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'1.25rem',flex:1,overflow:'hidden'}}>
        <div style={{display:'flex',flexDirection:'column',gap:'0.6rem',overflowY:'auto',paddingRight:'4px'}}>
          <p style={{color:'#94a3b8',fontWeight:700,fontSize:'0.6rem',textTransform:'uppercase',letterSpacing:'0.1em'}}>Select a Sentence</p>
          {SENTENCES.map(s=>{
            const cnt=prog[s.id]||0, done=cnt>=3, active=sel?.id===s.id;
            return (
              <button key={s.id} onClick={()=>setSel(s)} style={{padding:'0.875rem 1rem',borderRadius:'1.25rem',border:`3px solid ${active?'#4f46e5':'#f1f5f9'}`,background:active?'#4f46e5':'#fff',color:active?'#fff':'#334155',textAlign:'left',cursor:'pointer',position:'relative',boxShadow:active?'0 6px 20px rgba(79,70,229,0.2)':'0 1px 3px rgba(0,0,0,0.05)'}}>
                {done&&<span style={{position:'absolute',top:-7,right:-7,background:'#facc15',borderRadius:'9999px',padding:'3px',border:'2px solid #fff'}}><CheckCircle2 size={11} color="#fff"/></span>}
                <div style={{display:'flex',alignItems:'center',gap:'6px',marginBottom:'3px'}}>
                  <span style={{fontSize:'0.6rem',fontWeight:900,padding:'2px 7px',borderRadius:'9999px',background:active?'rgba(255,255,255,0.2)':'#eef2ff',color:active?'#fff':'#6366f1'}}>#{s.id}</span>
                  <div style={{display:'flex',gap:'2px'}}>{[1,2,3].map(i=><div key={i} style={{width:'6px',height:'6px',borderRadius:'9999px',background:cnt>=i?(active?'#fff':'#6366f1'):(active?'rgba(255,255,255,0.3)':'#e2e8f0')}}/>)}</div>
                </div>
                <p style={{fontSize:'0.95rem',fontWeight:900,marginBottom:'2px'}}>{s.english}</p>
                <p style={{fontSize:'0.75rem',fontWeight:500,color:active?'rgba(255,255,255,0.7)':'#94a3b8'}}>{s.japanese}</p>
              </button>
            );
          })}
        </div>
        <div style={{background:'#eef2ff',borderRadius:'2rem',padding:'2rem',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',border:'3px solid #e0e7ff'}}>
          {sel ? (
            <div style={{display:'flex',flexDirection:'column',alignItems:'center',width:'100%'}}>
              <div style={{textAlign:'center',marginBottom:'2rem'}}>
                <h3 style={{fontSize:'1.5rem',fontWeight:900,color:'#1e293b',marginBottom:'0.5rem'}}>{sel.english}</h3>
                <p style={{fontSize:'0.875rem',color:'#94a3b8'}}>"{sel.japanese}"</p>
              </div>
              <div style={{display:'flex',gap:'1.75rem',marginBottom:'1.5rem'}}>
                <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:'6px'}}>
                  <button onClick={()=>{speak(sel.english);onListen(sel.id);}} style={{width:'70px',height:'70px',background:'#fff',borderRadius:'9999px',display:'flex',alignItems:'center',justifyContent:'center',border:'2px solid #e0e7ff',cursor:'pointer',color:'#4f46e5',boxShadow:'0 4px 12px rgba(79,70,229,0.12)'}}><Volume2 size={28}/></button>
                  <span style={{fontSize:'0.65rem',fontWeight:900,color:'#6366f1',textTransform:'uppercase'}}>Listen</span>
                </div>
                <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:'6px'}}>

                    {rec?<div style={{width:'20px',height:'20px',background:'#fff',borderRadius:'4px'}}/>:<Mic size={28} color="#fff"/>}
                  </button>
                  <span style={{fontSize:'0.65rem',fontWeight:900,color:'#6366f1',textTransform:'uppercase'}}>{rec?'Stop':'Record'}</span>

                <Play size={15} fill="#4f46e5" color="#4f46e5"/> さっきのはつおんをきく
              </button>}
            </div>
          ) : (
            <div style={{textAlign:'center',opacity:0.4}}>
              <Mic size={60} color="#818cf8" style={{display:'block',margin:'0 auto 0.75rem'}}/>
              <p style={{fontSize:'1.1rem',fontWeight:900,color:'#6366f1'}}>ぶんしょう を えらんでね！</p>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function App() {
  const [view, setView] = useState('login');

  const [aProg, setAProg] = useState({});
  const [sProg, setSProg] = useState({});
  const [cat, setCat] = useState(null);

  useEffect(()=>{
    try {
      const a=localStorage.getItem('aa_typing'); if(a) setTStats(JSON.parse(a));
      const b=localStorage.getItem('aa_alpha'); if(b) setAProg(JSON.parse(b));
      const c=localStorage.getItem('aa_sent'); if(c) setSProg(JSON.parse(c));
    } catch(e){}
  },[]);

  const login = () => { if(num.length===4){setView('menu');setErr('');}else setErr('4ケタ の ばんごう を いれてね'); };
  const back = () => { if(view==='typing_game') setView('typing_select'); else setView('menu'); };

  const finishTyping = (wpm,time,mc) => {
    if(!cat) return;
    const cur=tStats[cat]||{bestWpm:0,bestTime:9999,minMistakes:999};
    const next={...tStats,[cat]:{bestWpm:Math.max(cur.bestWpm,wpm),bestTime:Math.min(cur.bestTime,time),minMistakes:Math.min(cur.minMistakes??999,mc)}};
    setTStats(next); localStorage.setItem('aa_typing',JSON.stringify(next));
  };
  const listenAlpha = (letter,word) => {
    const lp=aProg[letter]||{};
    const next={...aProg,[letter]:{...lp,[word]:(lp[word]||0)+1}};
    setAProg(next); localStorage.setItem('aa_alpha',JSON.stringify(next));
  };
  const listenSent = id => {
    const next={...sProg,[id]:(sProg[id]||0)+1};
    setSProg(next); localStorage.setItem('aa_sent',JSON.stringify(next));
  };

  const cats = Object.keys(TYPING);
  const allAlpha = ALPHABETS.every(a=>a.words.every(w=>(aProg[a.letter]?.[w.word]||0)>=3));
  const allSent = [1,2,3,4,5,6].every(id=>(sProg[id]||0)>=3);
  const allTyping = cats.every(c=>tStats[c]?.minMistakes===0);

    {id:'alpha',title:'アルファベット',Icon:BookOpen,bg:'#10b981',sh:'rgba(16,185,129,0.3)',desc:'よみかた と フォニックス',done:allAlpha},

    {id:'pronounce',title:'はつおん',Icon:Mic,bg:'#4f46e5',sh:'rgba(79,70,229,0.3)',desc:'きれいな はつおん',done:allSent},
  ];

  const isSubView = view !== 'login' && view !== 'menu';

  return (
    <div style={{minHeight:'100vh',background:'#eef2ff',fontFamily:'-apple-system,BlinkMacSystemFont,"Segoe UI",Hiragino Sans,sans-serif',color:'#1e293b',position:'relative',overflowX:'hidden'}}>

        <div style={{position:'absolute',top:'5%',left:'5%',width:'300px',height:'300px',background:'#bfdbfe',borderRadius:'9999px',filter:'blur(80px)',opacity:0.25}}/>
        <div style={{position:'absolute',bottom:'10%',right:'8%',width:'340px',height:'340px',background:'#fde68a',borderRadius:'9999px',filter:'blur(80px)',opacity:0.2}}/>
        <div style={{position:'absolute',top:'45%',left:'35%',width:'260px',height:'260px',background:'#c4b5fd',borderRadius:'9999px',filter:'blur(80px)',opacity:0.15}}/>
      </div>

      {/* LOGIN */}
      {view==='login' && (
        <div style={{position:'relative',zIndex:1,display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100vh',padding:'1.5rem'}}>
          <div style={{background:'#fff',padding:'2.5rem',borderRadius:'3rem',boxShadow:'0 24px 64px rgba(0,0,0,0.12)',width:'100%',maxWidth:'400px',border:'6px solid #fff'}}>
            <div style={{display:'flex',flexDirection:'column',alignItems:'center',marginBottom:'2rem'}}>
              <div style={{background:'#3b82f6',padding:'1.5rem',borderRadius:'2rem',boxShadow:'0 8px 24px rgba(59,130,246,0.35)',marginBottom:'1.5rem',transition:'transform 0.3s',cursor:'default'}} onMouseEnter={e=>e.currentTarget.style.transform='rotate(0deg)'} onMouseLeave={e=>e.currentTarget.style.transform='rotate(-3deg)'} style2={{transform:'rotate(-3deg)'}}>

                  onChange={e=>setNum(e.target.value.replace(/\D/g,''))}
                  onKeyDown={e=>e.key==='Enter'&&login()}
                  style={{width:'100%',textAlign:'center',fontSize:'2.75rem',letterSpacing:'0.5em',fontWeight:900,padding:'1rem',background:'#f8fafc',border:'3px solid #e2e8f0',borderRadius:'1.25rem',outline:'none',boxSizing:'border-box',fontFamily:'inherit',transition:'border-color 0.2s'}}
                  onFocus={e=>e.target.style.borderColor='#3b82f6'} onBlur={e=>e.target.style.borderColor='#e2e8f0'}
                />
                {err && <p style={{color:'#ef4444',fontWeight:700,marginTop:'0.5rem',textAlign:'center',fontSize:'0.875rem'}}>{err}</p>}
              </div>
              <button onClick={login} style={{width:'100%',background:'#3b82f6',color:'#fff',fontSize:'1.375rem',fontWeight:900,padding:'1.125rem',borderRadius:'1.75rem',border:'none',cursor:'pointer',boxShadow:'0 8px 24px rgba(59,130,246,0.35)',display:'flex',alignItems:'center',justifyContent:'center',gap:'0.6rem',transition:'background 0.15s'}} onMouseEnter={e=>e.currentTarget.style.background='#2563eb'} onMouseLeave={e=>e.currentTarget.style.background='#3b82f6'}>
                <Play size={26}/> スタート！
              </button>
            </div>
          </div>
        </div>
      )}

      {/* MENU */}
      {view==='menu' && (
        <div style={{position:'relative',zIndex:1,display:'flex',flexDirection:'column',minHeight:'100vh',maxWidth:'920px',margin:'0 auto',padding:'2rem'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'2.5rem'}}>
            <div style={{background:'rgba(255,255,255,0.85)',backdropFilter:'blur(8px)',padding:'0.875rem 1.5rem',borderRadius:'1.5rem',boxShadow:'0 2px 12px rgba(0,0,0,0.07)',border:'2px solid rgba(255,255,255,0.9)'}}>
              <h2 style={{fontSize:'1.6rem',fontWeight:900,color:'#1e293b',letterSpacing:'-0.02em'}}>Alphabet Adventure</h2>
              <p style={{color:'#3b82f6',fontWeight:700,fontSize:'0.9rem'}}>Hello, No.{num}!</p>
            </div>
            <button onClick={()=>setView('login')} style={{padding:'0.875rem',background:'#fff',borderRadius:'1.25rem',boxShadow:'0 4px 16px rgba(0,0,0,0.08)',border:'2px solid #f1f5f9',color:'#94a3b8',cursor:'pointer',transition:'all 0.15s'}} onMouseEnter={e=>{e.currentTarget.style.color='#ef4444';e.currentTarget.style.transform='scale(1.1)';}} onMouseLeave={e=>{e.currentTarget.style.color='#94a3b8';e.currentTarget.style.transform='scale(1)';}}>
              <RotateCcw size={24}/>
            </button>
          </div>
          {allDone && (
            <div style={{marginBottom:'2rem',background:'#facc15',padding:'1.75rem',borderRadius:'2.5rem',textAlign:'center',boxShadow:'0 8px 24px rgba(250,204,21,0.4)',border:'6px solid #fff'}}>
              <h2 style={{fontSize:'1.75rem',fontWeight:900,color:'#fff',marginBottom:'4px'}}>Great Job! 🎉</h2>
              <p style={{fontSize:'1.1rem',fontWeight:900,color:'#713f12'}}>これであなたも アルファベットマスターだ！</p>
            </div>
          )}
          <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'1.75rem'}}>
            {menu.map(item=>(
              <button key={item.id} onClick={()=>setView(item.id)} style={{background:'#fff',padding:'2.25rem',borderRadius:'2.5rem',boxShadow:'0 8px 32px rgba(0,0,0,0.08)',border:'4px solid #fff',display:'flex',flexDirection:'column',alignItems:'center',cursor:'pointer',position:'relative',transition:'all 0.25s cubic-bezier(0.34,1.56,0.64,1)'}} onMouseEnter={e=>{e.currentTarget.style.transform='translateY(-10px) scale(1.02)';e.currentTarget.style.boxShadow='0 20px 48px rgba(0,0,0,0.14)';}} onMouseLeave={e=>{e.currentTarget.style.transform='translateY(0) scale(1)';e.currentTarget.style.boxShadow='0 8px 32px rgba(0,0,0,0.08)';}}>
                {item.done && <div style={{position:'absolute',top:'-12px',right:'-12px',background:'#facc15',padding:'9px',borderRadius:'9999px',boxShadow:'0 4px 12px rgba(250,204,21,0.4)',border:'4px solid #fff',zIndex:2}}><CheckCircle2 size={20} color="#fff"/></div>}
                <div style={{background:item.bg,padding:'1.75rem',borderRadius:'2rem',marginBottom:'1.25rem',boxShadow:`0 8px 24px ${item.sh}`}}>
                  <item.Icon size={48} color="#fff"/>
                </div>
                <h3 style={{fontSize:'1.35rem',fontWeight:900,marginBottom:'0.5rem'}}>{item.title}</h3>
                <p style={{color:'#94a3b8',fontWeight:700,textAlign:'center',fontSize:'0.85rem'}}>{item.desc}</p>
              </button>
            ))}
          </div>
        </div>
      )}

      {/* SUB VIEWS */}
      {isSubView && (
        <div style={{position:'relative',zIndex:1,display:'flex',flexDirection:'column',minHeight:'100vh',maxWidth:'1080px',margin:'0 auto',padding:'1.75rem'}}>
          <div style={{marginBottom:'1.25rem'}}>
            <button onClick={back} style={{display:'flex',alignItems:'center',gap:'0.4rem',fontSize:'0.95rem',fontWeight:900,color:'#64748b',background:'none',border:'none',cursor:'pointer',transition:'color 0.15s'}} onMouseEnter={e=>e.currentTarget.style.color='#3b82f6'} onMouseLeave={e=>e.currentTarget.style.color='#64748b'}>
              <div style={{background:'#fff',padding:'0.5rem',borderRadius:'0.875rem',boxShadow:'0 2px 8px rgba(0,0,0,0.07)',border:'2px solid #f1f5f9'}}><ChevronLeft size={18}/></div>
              もどる
            </button>
          </div>
          <div style={{flex:1,background:'#fff',borderRadius:'3rem',boxShadow:'0 12px 48px rgba(0,0,0,0.1)',border:'6px solid #fff',padding:'2rem',overflow:'auto',display:'flex',flexDirection:'column'}}>
            {view==='alpha' && <AlphabetView prog={aProg} onListen={listenAlpha}/>}
            {view==='typing_select' && <TypingSelect stats={tStats} onSelect={c=>{setCat(c);setView('typing_game');}}/>}
            {view==='typing_game' && cat && <TypingSession category={cat} onFinish={finishTyping}/>}
            {view==='pronounce' && <PronounLab prog={sProg} onListen={listenSent}/>}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
