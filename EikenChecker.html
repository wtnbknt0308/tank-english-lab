<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>英検 実力診断チェッカー | Tank English Lab</title>
<style>
:root {
  --navy: #1b2a4a;
  --gold: #c9a227;
  --paper: #f6f4ee;
  --ink: #22293a;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  background: var(--paper);
  background-image: radial-gradient(#e9e5da 1px, transparent 1px);
  background-size: 22px 22px;
  color: var(--ink);
  font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "BIZ UDPGothic", "Yu Gothic UI", "Yu Gothic", "Meiryo", sans-serif;
  font-size: 17px;
  line-height: 1.6;
}
.wrap { max-width: 620px; margin: 0 auto; padding: 12px 14px 40px; }
.topBar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 4px; color: var(--navy); font-weight: 700;
}
.topLogo { letter-spacing: 0.04em; }
.topUser { font-size: 14px; font-weight: 600; color: #5a6478; }
.foot { text-align: center; color: #a3a89b; font-size: 12px; margin-top: 26px; letter-spacing: 0.1em; }

.card {
  background: #fff;
  border: 1px solid #e4e0d4;
  border-radius: 18px;
  padding: 22px 20px;
  box-shadow: 0 3px 14px rgba(27, 42, 74, 0.07);
  margin-top: 10px;
}
.center { text-align: center; }

.crest {
  width: 74px; height: 74px; margin: 6px auto 12px;
  background: var(--navy); color: var(--gold);
  border: 3px solid var(--gold); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 34px; font-weight: 800;
  box-shadow: 0 4px 10px rgba(27, 42, 74, 0.25);
}
.appTitle { margin: 0 0 6px; font-size: 25px; color: var(--navy); letter-spacing: 0.03em; }
.sub { margin: 0 0 18px; color: #5a6478; font-size: 15px; }
.h2 { margin: 0 0 16px; font-size: 21px; color: var(--navy); }
.h3 { margin: 24px 0 10px; font-size: 17px; color: var(--navy); border-left: 5px solid var(--gold); padding-left: 9px; }

.fieldLabel { display: block; text-align: left; font-size: 14px; font-weight: 700; color: var(--navy); margin-bottom: 6px; }
.nameInput, .writeInput {
  width: 100%; font-size: 19px; padding: 13px 14px;
  border: 2px solid #cfd6e4; border-radius: 12px;
  font-family: inherit;
}
.nameInput:focus, .writeInput:focus { outline: none; border-color: var(--gold); }
.writeInput { font-family: "Consolas", "Menlo", monospace; letter-spacing: 0.02em; margin-bottom: 14px; }
.lastNote { font-size: 14px; color: #5a6478; margin: 12px 0 0; }

.bigBtn {
  display: block; width: 100%; margin-top: 16px;
  font-size: 19px; font-weight: 800; font-family: inherit;
  padding: 15px; border: none; border-radius: 14px;
  color: #fff; cursor: pointer;
  box-shadow: 0 3px 0 rgba(0, 0, 0, 0.18);
  transition: transform 0.06s;
}
.bigBtn:active { transform: translateY(2px); box-shadow: none; }
.bigBtn:disabled { opacity: 0.4; cursor: default; }
.bigBtn.gold { background: linear-gradient(180deg, #d8b23a, #c9a227); color: #3a2f06; }
.bigBtn.navy { background: var(--navy); }

.gradeGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.gradeBtn {
  position: relative;
  background: #fff; border: 2px solid var(--navy); border-radius: 16px;
  padding: 18px 10px 14px; cursor: pointer; font-family: inherit;
  display: flex; flex-direction: column; align-items: center; gap: 5px;
}
.gradeBtn:not(.off):active { background: #f0ecdf; }
.gradeBtn.off { border-color: #d4d2c8; opacity: 0.6; cursor: default; }
.gradeBadge {
  background: var(--navy); color: var(--gold);
  font-size: 21px; font-weight: 800;
  padding: 7px 16px; border-radius: 999px; border: 2px solid var(--gold);
}
.gradeBtn.off .gradeBadge { background: #8b8f99; color: #eee; border-color: #bbb; }
.gradeDesc { font-size: 13px; color: #5a6478; }
.soon {
  position: absolute; top: 8px; right: 8px;
  background: #8b8f99; color: #fff; font-size: 11px; font-weight: 700;
  padding: 2px 8px; border-radius: 999px;
}
.hintBox {
  margin-top: 16px; background: #f0f3f9; border-radius: 12px;
  padding: 12px 14px; font-size: 14px; color: #44506b;
}

.stampRail {
  display: flex; gap: 6px; justify-content: space-between;
  background: #fff; border: 1px solid #e4e0d4; border-radius: 14px;
  padding: 8px; margin-top: 6px;
}
.stamp {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 6px 2px; border-radius: 10px; opacity: 0.45;
  border: 2px dashed #cfd0c8;
}
.stamp.now { opacity: 1; border: 2px solid var(--sc); background: color-mix(in srgb, var(--sc) 8%, #fff); }
.stamp.done { opacity: 1; border: 2px solid var(--sc); background: var(--sc); }
.stamp.done .stampIcon, .stamp.done .stampName { color: #fff; }
.stampIcon { font-size: 17px; }
.stampName { font-size: 10px; font-weight: 700; color: #44506b; letter-spacing: 0; }
.progressText { text-align: right; font-size: 13px; color: #7a8298; margin: 6px 4px 0; font-weight: 700; }

.secBadge {
  width: 78px; height: 78px; margin: 4px auto 14px;
  border-radius: 22px; display: flex; align-items: center; justify-content: center;
  font-size: 38px; color: #fff; box-shadow: 0 5px 12px rgba(27, 42, 74, 0.2);
}

.qNum { margin: 0 0 4px; font-size: 13px; font-weight: 800; color: var(--gold); letter-spacing: 0.08em; }
.qText { margin: 0 0 14px; font-size: 19px; font-weight: 700; color: var(--navy); }
.qText.en { font-size: 20px; }

.playBtn {
  display: block; width: 100%;
  font-size: 17px; font-weight: 800; font-family: inherit;
  padding: 14px; margin-bottom: 14px;
  border: 2px solid #2e86ab; border-radius: 14px;
  background: #eaf4f9; color: #1d5c78; cursor: pointer;
}
.playBtn.playing { background: #2e86ab; color: #fff; }
.playBtn:disabled { opacity: 0.5; cursor: default; }

.optList { display: flex; flex-direction: column; gap: 10px; }
.opt {
  text-align: left; font-size: 18px; font-family: inherit; font-weight: 600;
  padding: 13px 15px; border: 2px solid #cfd6e4; border-radius: 13px;
  background: #fff; color: var(--ink); cursor: pointer;
}
.opt.sel { border-color: var(--gold); background: #fdf7e3; box-shadow: 0 0 0 2px rgba(201, 162, 39, 0.25); }

.passage {
  background: #f2f7f3; border: 1.5px solid #cfe2d4; border-radius: 13px;
  padding: 13px 15px; margin-bottom: 16px;
}
.passageTitle { margin: 0 0 6px; font-size: 13px; font-weight: 800; color: #2f8f5b; }
.passageText { margin: 0; font-size: 17px; line-height: 1.8; }

.answerLine {
  min-height: 58px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  border: 2px dashed #b9a75e; border-radius: 13px; background: #fdfaef;
  padding: 10px; margin-bottom: 14px;
}
.lineHint { color: #b0a887; font-size: 14px; padding-left: 4px; }
.wordPool { display: flex; flex-wrap: wrap; gap: 9px; margin-bottom: 6px; }
.wordCard {
  font-size: 18px; font-weight: 700; font-family: inherit;
  padding: 9px 15px; border-radius: 11px; cursor: pointer;
  border: 2px solid #7b5ea7; background: #fff; color: #4a3a68;
  box-shadow: 0 2px 0 rgba(123, 94, 167, 0.35);
}
.wordCard.inLine { background: #7b5ea7; color: #fff; box-shadow: none; }

.resultTop { display: flex; align-items: center; gap: 18px; margin-bottom: 8px; }
.judgeStamp {
  width: 108px; height: 108px; flex-shrink: 0;
  border: 4px solid var(--jc); border-radius: 50%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: var(--jc); transform: rotate(-8deg);
  background: radial-gradient(circle, #fff 60%, color-mix(in srgb, var(--jc) 10%, #fff));
}
.judgeKey { font-size: 40px; font-weight: 900; line-height: 1; }
.judgeLabel { font-size: 14px; font-weight: 800; }
.scoreBig { margin: 0; font-size: 40px; font-weight: 900; color: var(--navy); line-height: 1.1; }
.scoreSmall { font-size: 18px; font-weight: 700; color: #7a8298; }
.scorePct { margin: 2px 0 6px; font-size: 15px; font-weight: 700; color: var(--gold); }
.judgeMsg { margin: 0; font-size: 14px; color: #44506b; }

.barRow { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.barLabel { width: 128px; font-size: 13px; font-weight: 700; color: #44506b; }
.barTrack { flex: 1; height: 14px; background: #edeae0; border-radius: 999px; overflow: hidden; }
.barFill { height: 100%; border-radius: 999px; }
.barNum { width: 34px; text-align: right; font-size: 13px; font-weight: 800; color: var(--navy); }
.weakNote { font-size: 14px; background: #fdf7e3; border-radius: 10px; padding: 9px 12px; margin: 12px 0 0; }

.reviewList { display: flex; flex-direction: column; gap: 10px; }
.reviewItem { border: 1.5px solid #e0ddd2; border-radius: 13px; padding: 12px 14px; }
.reviewItem.ok { background: #f6faf4; border-color: #cfe2d4; }
.reviewItem.ng { background: #fdf5f4; border-color: #ecd2d2; }
.reviewHead { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
.reviewMark { font-size: 20px; font-weight: 900; }
.reviewItem.ok .reviewMark { color: #2f8f5b; }
.reviewItem.ng .reviewMark { color: #c5484b; }
.reviewSec { font-size: 11px; font-weight: 800; color: #fff; padding: 2px 9px; border-radius: 999px; }
.reviewQ { font-size: 12px; font-weight: 700; color: #7a8298; }
.reviewText { margin: 0 0 4px; font-size: 15px; font-weight: 700; }
.reviewAns { margin: 0; font-size: 14px; color: #44506b; }
.reviewAns.model b { color: #2f8f5b; }
.pointNote { margin: 6px 0 0; font-size: 13px; background: #fff; border-radius: 9px; padding: 7px 10px; }
.writingExtra { margin-top: 6px; }
.overrideBtn {
  margin-top: 8px; font-size: 13px; font-weight: 700; font-family: inherit;
  padding: 7px 14px; border-radius: 999px; cursor: pointer;
  border: 1.5px solid var(--navy); background: #fff; color: var(--navy);
}
.btnRow { margin-top: 20px; }

@media (min-width: 480px) {
  .gradeGrid { grid-template-columns: 1fr 1fr 1fr 1fr; }
}

/* 生徒番号入力 */
.numInput { text-align: center; font-size: 26px; letter-spacing: 0.4em; font-weight: 800; max-width: 240px; margin: 0 auto; display: block; }

/* 合格ラインメーター */
.meterBox {
  margin: 18px 0 6px; background: #fbfaf5; border: 1.5px solid #e4e0d4;
  border-radius: 14px; padding: 14px 16px 12px;
}
.meterTitle { margin: 0 0 34px; font-size: 13px; font-weight: 800; color: #44506b; }
.meterTrack {
  position: relative; height: 22px; border-radius: 999px; overflow: visible;
  display: flex; box-shadow: inset 0 1px 3px rgba(0,0,0,0.12);
}
.meterZone { height: 100%; }
.meterZone.zoneC { background: #d9d5c8; border-radius: 999px 0 0 999px; }
.meterZone.zoneB { background: #9fc3d6; }
.meterZone.zoneA { background: linear-gradient(90deg, #d8b23a, #c9a227); border-radius: 0 999px 999px 0; }
.passLine {
  position: absolute; top: -8px; bottom: -8px; width: 3px;
  background: var(--navy); transform: translateX(-50%);
}
.passLabel {
  position: absolute; top: -32px; left: 50%; transform: translateX(-50%);
  font-size: 10px; font-weight: 800; color: var(--navy);
  white-space: nowrap; text-align: center; line-height: 1.25;
}
.youMarker { position: absolute; top: -4px; transform: translateX(-50%); text-align: center; }
.youArrow { display: block; font-size: 15px; color: #c5484b; line-height: 1; margin-top: -14px; }
.youLabel {
  position: absolute; top: 26px; left: 50%; transform: translateX(-50%);
  font-size: 11px; font-weight: 800; color: #c5484b; white-space: nowrap;
  background: #fff; border: 1.5px solid #c5484b; border-radius: 999px; padding: 1px 8px;
}
.meterScale { display: flex; justify-content: space-between; font-size: 11px; color: #8b8f99; font-weight: 700; margin-top: 26px; }
.meterMsg { margin: 6px 0 0; text-align: center; font-size: 15px; font-weight: 800; color: #c5484b; }
.meterMsg.over { color: #a3841a; }

/* 時間パネル */
.timeBox { margin: 14px 0 4px; background: #fbfaf5; border: 1.5px solid #e4e0d4; border-radius: 14px; padding: 14px 16px; }
.timeHead { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
.timeIcon { font-size: 18px; }
.timeTotal { font-size: 19px; font-weight: 900; color: var(--navy); }
.timeTargetNote { font-size: 12px; color: #8b8f99; font-weight: 700; }
.timeRows { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
.timeRow { display: flex; align-items: baseline; gap: 6px; font-size: 13px; }
.timeLabel { width: 128px; font-weight: 700; color: #44506b; }
.timeVal { font-weight: 800; color: var(--navy); }
.timeVal.over { color: #c5484b; }
.timeTgt { font-size: 11px; color: #8b8f99; }
.adviceBox { background: #fdf7e3; border-radius: 10px; padding: 10px 12px; }
.adviceTitle { margin: 0 0 4px; font-size: 12px; font-weight: 800; color: #a3841a; }
.adviceText { margin: 0; font-size: 14px; font-weight: 600; color: #44506b; line-height: 1.55; }
.adviceText + .adviceText { margin-top: 4px; }

/* リスニングスクリプト表示 */
.scriptBox { background: #eef4f8; border: 1.5px solid #cfe0ea; border-radius: 10px; padding: 9px 12px; margin: 4px 0 8px; }
.scriptTitle { margin: 0 0 4px; font-size: 11px; font-weight: 800; color: #2e86ab; }
.scriptLine { margin: 0 0 3px; font-size: 14px; line-height: 1.5; }
.scriptLine.narr { color: #5a6478; font-style: italic; }
.scriptIcon { font-size: 13px; }
.playBtn.waiting { background: #f3f0e6; border-color: #c9a227; color: #8a7317; }

</style>
</head>
