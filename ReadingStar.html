FF1F",options:["\u6295\u3052\u3066\u904A\u3076\u305F\u3081","\u8C9D\u3092\u98DF\u3079\u308B\u305F\u3081","\u6795\u306B\u3059\u308B\u305F\u3081"],answer:"\u8C9D\u3092\u98DF\u3079\u308B\u305F\u3081",explanation:'"They use the stones to eat shells" \u3068\u3042\u308A\u307E\u3059\u3002'}]},{id:"g1-p58",grade:1,index:58,title:"\u30B3\u30A2\u30E9\u306E\u7761\u7720",body:"Koalas are popular animals in Australia. They are very cute, but they are very sleepy. They sleep for twenty hours every day. They eat eucalyptus leaves. Emily likes koalas very much. Do you have koalas in your town?",wordCount:38,questions:[{id:"q1",title:"\u30B3\u30A2\u30E9\u306F1\u65E5\u306B\u4F55\u6642\u9593\u7720\u308A\u307E\u3059\u304B\uFF1F",options:["10\u6642\u9593","20\u6642\u9593","24\u6642\u9593"],answer:"20\u6642\u9593",explanation:'"They sleep for twenty hours every day" \u3068\u3042\u308A\u307E\u3059\u3002'},{id:"q2",title:"\u30B3\u30A2\u30E9\u306F\u4F55\u3092\u98DF\u3079\u307E\u3059\u304B\uFF1F",options:["\u30EA\u30F3\u30B4","\u30E6\u30FC\u30AB\u30EA\u306E\u8449","\u9B5A"],answer:"\u30E6\u30FC\u30AB\u30EA\u306E\u8449",explanation:'"They eat eucalyptus leaves" \u3068\u3042\u308A\u307E\u3059\u3002'},{id:"q3",title:"\u6587\u7AE0\u306E\u4E2D\u3067\u3001\u30B3\u30A2\u30E9\u306F\u3069\u3053\u306E\u56FD\u3067\u4EBA\u6C17\u3060\u3068\u8A00\u3063\u3066\u3044\u307E\u3059\u304B\uFF1F",options:["\u30A2\u30E1\u30EA\u30AB","\u65E5\u672C","\u30AA\u30FC\u30B9\u30C8\u30E9\u30EA\u30A2"],answer:"\u30AA\u30FC\u30B9\u30C8\u30E9\u30EA\u30A2",explanation:'"Koalas are popular animals in Australia" \u3068\u3042\u308A\u307E\u3059\u3002'}]},{id:"g1-p59",grade:1,index:59,title:"\u30DD\u30C6\u30C8\u30C1\u30C3\u30D7\u30B9\u306E\u8A95\u751F",body:"I like potato chips. They are very thin and salty. Long ago, a man made them. A customer said, \u201CThese fried potatoes are too thick!\u201D So the man made very thin potatoes. Now, many people love potato chips.",wordCount:38,questions:[{id:"q1",title:"\u30DD\u30C6\u30C8\u30 re in summer" \u3068\u3042\u308A\u307E\u3059\u3002'}]},{id:"g1-p65",grade:1,index:65,title:"AI\u3068\u6C34",body:"We use AI every day. AI is very useful, but it needs a lot of water. It needs water to cool the big computers. Five questions to AI use about 500ml of water. We should use AI and water carefully.",wordCount:40,questions:[{id:"q1",title:"AI\u306F\u4F55\u3092\u305F\u304F\u3055\u3093\u5FC5\u8981\u3068\u3059\u308B\u3068\u66F8\u304B\u308C\u3066\u3044\u307E\u3059\u304B\uFF1F",options:["\u96FB\u6C17\u3060\u3051","\u6C34","\u7D19"],answer:"\u6C34",explanation:'"it needs a lot of water" \u3068\u3042\u308A\u307E\u3059\u3002'},{id:"q2",title:"\u306A\u305CAI\u306B\u306F\u6C34\u304C\u5FC5\u8981\u306A\u306E\u3067\u3059\u304B\uFF1F",options:["\u30B3\u30F3\u30D4\u30E5\u30FC\u30BF\u3092\u51B7\u3084\u3059\u305F\u3081","\u30B3\u30F3\u30D4\u30E5\u30FC\u30BF\u3092\u6D17\u3046\u305F\u3081","\u84B8\u6C17\u3092\u4F5C\u308B\u305F\u3081"],answer:"\u30B3\u30F3\u30D4\u30E5\u30FC\u30BF\u3092\u51B7\u3084\u3059\u305F\u3081",explanation:'"It needs water to cool the big computers" \u3068\u3042\u308A\u307E\u3059\u3002'},{id:"q3",title:"AI\u3078\u306E5\u3064\u306E\u8CEA\u554F\u3067\u3001\u7D04\u3069\u308C\u304F\u3089\u3044\u306E\u6C34\u3092\u4F7F\u3044\u307E\u3059\u304B\uFF1F",options:["50ml","500ml","5\u30EA\u30C3\u30C8\u30EB"],answer:"500ml",explanation:'"Five questions to AI use about 500ml of water" \u3068\u3042\u308A\u307E\u3059\u3002'}]},{id:"g1-p66",grade:1,index:66,title:"\u53F3\u8033\u306E\u4E0D\u601D\u8B70",body:"I have a question for you. Do you want to ask a favor? Please speak to the person's right ear. People like words from the right ear. The favor rate is two times higher! It is a very interesting fact.",wordCount:40,questions:[{id:"q1",title:"\u304A\u9858\u3044\u4E8B\uFF08favor\uFF09\u3092\u3059\u308B\u3068\u304D\u3001\u3069\u3061\u3089\u306E\u8033\u306B\u8A71\u3057\u304B\u3051\u308B\u306E\u304C\u826F\u3044\u3067\u3059\u304B\uFF1F",options:["\u5DE6\u8033","\u53F3\u8033"," 6E\u52D5\u7269\u5712\u306B\u3044\u308B",explanation:'"There are quokkas in a few zoos in Japan too" \u3068\u3042\u308A\u307E\u3059\u3002'}]},{id:"g1-p108",grade:1,index:108,title:"\u304A\u8179\u304C\u7A7A\u3044\u305F\uFF01",body:"Dad, I'm hungry. Me too. Is there a restaurant near here? Yes, there is a steak restaurant over there. Great! How can we get there? We can go there on foot. It takes only three minutes from here. Are there any other shops near the restaurant? Yes, there are some convenience stores too. Let's go to the restaurant first!",wordCount:59,questions:[{id:"q1",title:"\u89AA\u5B50\u306F\u3069\u3053\u3078\u884C\u3053\u3046\u3068\u3057\u3066\u3044\u307E\u3059\u304B\uFF1F",options:["\u30B1\u30FC\u30AD\u5C4B","\u30B9\u30C6\u30FC\u30AD\u30EC\u30B9\u30C8\u30E9\u30F3","\u516C\u5712"],answer:"\u30B9\u30C6\u30FC\u30AD\u30EC\u30B9\u30C8\u30E9\u30F3",explanation:'"there is a steak restaurant over there" \u3068\u3042\u308A\u307E\u3059\u3002'},{id:"q2",title:"\u305D\u3053\u3078\u884C\u304F\u624B\u6BB5\u306F\u4F55\u3067\u3059\u304B\uFF1F",options:["\u30D0\u30B9","\u96FB\u8ECA","\u5F92\u6B69\uFF08\u6B69\u304D\uFF09"],answer:"\u5F92\u6B69\uFF08\u6B69\u304D\uFF09",explanation:'"We can go there on foot" \u3068\u3042\u308A\u307E\u3059\u3002'},{id:"q3",title:"\u30EC\u30B9\u30C8\u30E9\u30F3\u306E\u307B\u304B\u306B\u3001\u8FD1\u304F\u306B\u4F55\u304C\u3042\u308A\u307E\u3059\u304B\uFF1F",options:["\u30B3\u30F3\u30D3\u30CB\u30A8\u30F3\u30B9\u30B9\u30C8\u30A2","\u6620\u753B\u9928","\u90F5\u4FBF\u5C40"],answer:"\u30B3\u30F3\u30D3\u30CB\u30A8\u30F3\u30B9\u30B9\u30C8\u30A2",explanation:'"there are some convenience stores too" \u3068\u3042\u308A\u307E\u3059\u3002'}]},{id:"g1-p109",grade:1,index:109,title:"\u30B9\u30A4\u30FC\u30C4\u306F\u5225\u8179\uFF1F",body:"I'm full. But I want something sweet. I know a new cake shop. Is it far from here? No, it isn't. How can we go there? We can go by bus. There is a bus stop in front of that hospital. There are many kinds of cakes in the shop. I am looking forward to eating a delicious strawberry cake!",wordCount:60,questions:[{id:"q1",title:"\u7B46\u8005\u306F\u4ECA\u3069\u306E\u3088\u3046\u306A\u72B6\u614B\u3067\u3059\u304B\uFF1F",options:["\u304A\u8179\u304C\u7A7A\u3044\u3066\u3044\u308B","\u304A\u8179\u304C\u3044\u3063\u3071\u3044\u3060\u304C\u7518\u3044\u3082\u306E\u304C\u98DF\u3079\u305F\u3044","\u5589\u304C\u6E07\u3044\u3066\u3044\u308B"],answer:"\u304A\u8179\u304C\u3044\u3063\u3071\u3044\u3060\u304C\u7518\u3044\u3082\u306E\u304C\u98DF\u3079\u305F\u3044",explanation:`"I'm full. But I want something sweet" \u3068\u3042\u308A\u307E\u3059\u3002`},{id:"q2",title:"\u30B1\u30FC\u30AD\u5C4B\u3078\u884C\u304F\u624B\u6BB5\u306F\u4F55\u3067\u3059\u304B\uFF1F",options:["\u81EA\u8EE2\u8ECA","\u30D0\u30B9","\u30BF\u30AF\u30B7\u30FC"],answer:"\u30D0\u30B9",explanation:'"We can go by bus" \u3068\u3042\u308A\u307E\u3059\u3002'},{id:"q3",title:"\u30D0\u30B9\u505C\u306F\u3069\u3053\u306B\u3042\u308A\u307E\u3059\u304B\uFF1F",options:["\u75C5\u9662\u306E\u524D","\u99C5\u306E\u96A3","\u516C\u5712\u306E\u4E2D"],answer:"\u75C5\u9662\u306E\u524D",explanation:'"There is a bus stop in front of that hospital" \u3068\u3042\u308A\u307E\u3059\u3002'}]},{id:"g1-p110",grade:1,index:110,title:"\u99C5\u3078\u306E\u9053\u6848\u5185",body:"Excuse me. How can I get to the station? Go straight and turn left at the second corner. You can see it on your left. Is there a landmark? Yes, there is a big clock tower near the station. There are also some taxis in front of the station. It is very easy to find. Thank you for your help.",wordCount:60,questions:[{id:"q1",title:"\u7B46\u8005\u306F\u3069\u3053\u3078\u884C\u304D\u305F\u3044\u3068\u8A00\u3063\u3066\u3044\u307E\u3059\u304B\uFF1F",options:["\u75C5\u9662","\u99C5","\u5B66\u6821"],answer:"\u99C5",explanation:'"How can I get to the station?" \u3068\u3042\u308A\u307E\u3059\u3002'},{id:"q2",title:"2\u3064\u76EE\u306E\u89D2\u3067\u3069\u306E\u3088\u3046\u306B\u66F2\u304C\u308A\u307E\u3059\u304B\uFF1F",options:["\u53F3","\u5DE6","\u66F2\u304C\u3089\u306A\u3044"],answer:"\u5DE6",explanation:'"turn left at the second corner" \u3068\u3042\u308A\u307E\u3059\u3002'},{id:"q3",title:"\u99C5\u306E\u8FD1\u304F\u306E\u76EE\u5370\u306F\u4F55\u3067\u3059\u304B\uFF1F",options:["\u5927\u304D\u306A\u6728","\u5927\u304D\u306A\u6642\u8A08\u5854","\u8D64\u3044\u6A4B"],answer:"\u5927\u304D\u306A\u6642\u8A08\u5854",explanation:'"a big clock tower near the station" \u3068\u3042\u308A\u307E\u3059\u3002'}]},{id:"g1-p111",grade:1,index:111,title:"\u51AC\u306E\u5929\u6C17\u3068\u6E29\u304B\u3044\u98F2\u307F\u7269",body:"How is the weather today? It is snowy and very cold. There is heavy snow in Hokkaido. Is there any snow in Tokyo? No, there isn't. It is sunny but chilly. How can we keep warm? Warm milk makes you sleep well and feel warm. There are many ways to enjoy a cold and quiet winter day.",wordCount:57,questions:[{id:"q1",title:"\u5317\u6D77\u9053\u306E\u5929\u6C17\u306F\u3069\u3046\u3067\u3059\u304B\uFF1F",options:["\u6674\u308C","\u96E8","\u5927\u96EA"],answer:"\u5927\u96EA",explanation:'"There is heavy snow in Hokkaido" \u3068\u3042\u308A\u307E\u3059\u3002'},{id:"q2",title:"\u6771\u4EAC\u306E\u5929\u6C17\u306F\u3069\u3046\u3067\u3059\u304B\uFF1F",options:["\u96EA","\u6674\u308C\u3066\u3044\u308B\u304C\u808C\u5BD2\u3044","\u66C7\u308A"],answer:"\u6674\u308C\u3066\u3044\u308B\u304C\u808C\u5BD2\u3044",explanation:'"It is sunny but chilly" \u3068\u3042\u308A\u307E\u3059\u3002'},{id:"q3",title:"\u4F53\u3092\u6E29\u3081\u308B\u65B9\u6CD5\u3068\u3057\u3066\u4F55\u304C\u52E7\u3081\u3089\u308C\u3066\u3044\u307E\u3059\u304B\uFF1F",options:["\u8D70\u308B\u3053\u3068","\u6E29\u304B\u3044\u725B\u4E73\u3092\u98F2\u3080\u3053\u3068","\u304A\u98A8\u5442\u306B\u5165\u308B\u3053\u3068"],answer:"\u6E29\u304B\u3044\u725B\u4E73\u3092\u98F2\u3080\u3053\u3068",explanation:'"Warm milk makes you sleep well and feel warm" \u3068\u3042\u308A\u307E\u3059\u3002'}]},{id:"g1-p112",grade:1,index:112,title:"\u30B3\u30A2\u30E9\u306E\u9577\u3044\u7720\u308A",body:"There are many koalas in Australia. They are very cute, but they are very sleepy. A koala usually sleeps for twenty hours every day! How can they sleep for such a long time? They eat eucalyptus leaves, and they need a lot of rest to digest them. Is there a koala in your city? No, there isn't.",wordCount:57,questions:[{id:"q1",title:"\u30B3\u30A2\u30E9\u306F1\u65E5\u306B\u4F55\u6642\u9593\u7720\u308A\u307E\u3059\u304B\uFF1F",options:["10\u6642\u9593","12\u6642\u9593","20\u6642\u9593"],answer:"20\u6642\u9593",explanation:'"sleeps for twenty hours every day" \u3068\u3042\u308A\u307E\u3059\u3002'},{id:"q2",title:"\u30B3\u30A2\u30E9\u306F\u4F55\u3092\u98DF\u3079\u307E\u3059\u304B\uFF1F",options:["\u9B5A","\u30E6\u30FC\u30AB\u30EA\u306E\u8449","\u679C\u7269"],answer:"\u30E6\u30FC\u30AB\u30EA\u306E\u8449",explanation:'"They eat eucalyptus leaves" \u3068\u3042\u308A\u307E\u3059\u3002'},{id:"q3",title:"\u306A\u305C\u30B3\u30A2\u30E9\u306F\u9577\u304F\u7720\u308B\u5FC5\u8981\u304C\u3042\u308B\u306E\u3067\u3059\u304B\uFF1F",options:["\u98DF\u3079\u305F\u3082\u306E\u3092\u6D88\u5316\u3059\u308B\u305F\u3081","\u5BD2\u3044\u304B\u3089","\u8D70\u308B\u306E\u304C\u901F\u3044\u304B\u3089"],answer:"\u98DF\u3079\u305F\u3082\u306E\u3092\u6D88\u5316\u3059\u308B\u305F\u3081",explanation:'"they need a lot of rest to digest them" \u3068\u3042\u308A\u307E\u3059\u3002'}]},{id:"g1-p113",grade:1,index:113,title:"\u975E\u5E38\u968E\u6BB5\u306E\u5DE6\u56DE\u308A\u306E\u79D8\u5BC6",body:"Look at the stairs in this building. They are emergency stairs. Is there a special rule for safety? Yes. These stairs are usually \u201Cleft-hand turn.\u201D How do people go down? People feel safe with left-hand turns during a fire. There are many smart rules for our lives. It is important to know them for our safety.",wordCount:56,questions:[{id:"q1",title:"\u3053\u306E\u6587\u7AE0\u306F\u4F55\u306E\u968E\u6BB5\u306B\u3064\u3044\u3066\u8FF0\u3079\u3066\u3044\u307E\u3059\u304B\uFF1F",options:["\u516C\u5712\u306E\u968E\u6BB5","\u975E\u5E38\u968E\u6BB5","\u5B66\u6821\u306E\u968E\u6BB5"],answer:"\u975E\u5E38\u968E\u6BB5",explanation:'"They are emergency stairs" \u3068\u3042\u308A\u307E\u3059\u3002'},{id:"q2",title:"\u975E\u5E38\u968E\u6BB5\u306F\u901A\u5E38\u3001\u3069\u306E\u3088\u3046\u306A\u56DE\u8EE2\u306B\u306A\u3063\u3066\u3044\u307E\u3059\u304B\uFF1F",options:["\u53F3\u56DE\u308A","\u5DE6\u56DE\u308A","\u76F4\u7DDA"],answer:"\u5DE6\u56DE\u308A",explanation:'"left-hand turn" \u3068\u3042\u308A\u307E\u3059\u3002'},{id:"q3",title:"\u306A\u305C\u305D\u306E\u3088\u3046\u306A\u8A2D\u8A08\u306B\u306A\u3063\u3066\u3044\u308B\u306E\u3067\u3059\u304B\uFF1F",options:["\u5EFA\u8A2D\u8CBB\u304C\u5B89\u3044\u304B\u3089","\u4EBA\u304C\u5B89\u5FC3\u3092\u611F\u3058\u308B\u304B\u3089","\u65E9\u304F\u8D70\u308C\u308B\u304B\u3089"],answer:"\u4EBA\u304C\u5B89\u5FC3\u3092\u611F\u3058\u308B\u304B\u3089",explanation:'"People feel safe with left-hand turns" \u3068\u3042\u308A\u307E\u3059\u3002'}]},{id:"g1-p114",grade:1,index:114,title:"\u5B66\u6821\u6848\u5185\u3068\u8077\u54E1\u5BA4",body:"Welcome to our school. There are thirty classrooms in this building. How can we go to the library? It is on the second floor. Go up the stairs and turn right. Is there a teacher's room? Yes, there is. It is near the entrance on the first floor. There are many kind teachers here. Please ask them questions.",wordCount:58,questions:[{id:"q1",title:"\u3053\u306E\u5EFA\u7269\u306B\u306F\u6559\u5BA4\u304C\u3044\u304F\u3064\u3042\u308A\u307E\u3059\u304B\uFF1F",options:["13","20","30"],answer:"30",explanation:'"There are thirty classrooms" \u3068\u3042\u308A\u307E\u3059\u3002'},{id:"q2",title:"\u56F3\u66F8\u9928\u306F\u4F55\u968E\u306B\u3042\u308A\u307E\u3059\u304B\uFF1F",options:["1\u968E","2\u968E","3\u968E"],answer:"2\u968E",explanation:'"It is on the second floor" \u3068\u3042\u308A\u307E\u3059\u3002'},{id:"q3",title:"\u8077\u54E1\u5BA4\uFF08teacher's room\uFF09\u306F\u3069\u3053\u306B\u3042\u308A\u307E\u3059\u304B\uFF1F",options:["\u56F3\u66F8\u9928\u306E\u96A3","1\u968E\u306E\u5165\u308A\u53E3\u306E\u8FD1\u304F","3\u968E"],answer:"1\u968E\u306E\u5165\u308A\u53E3\u306E\u8FD1\u304F",explanation:'"near the entrance on the first floor" \u3068\u3042\u308A\u307E\u3059\u3002'}]},{id:"g1-p115",grade:1,index:115,title:"\u30B3\u30F3\u30D3\u30CB\u306E\u306A\u3044\u9759\u304B\u306A\u753A",body:"Do you like your town? Yes. There is a big park and a beautiful river. How many convenience stores are there? Actually, there aren't any convenience stores here. Really? Is it difficult for you? No. There is a small grocery store near my house. There are many fresh vegetables and fruits. I like the store very much.",wordCount:57,questions:[{id:"q1",title:"\u7B46\u8005\u306E\u753A\u306B\u306F\u4F55\u304C\u3042\u308A\u307E\u3059\u304B\uFF1F",options:["\u5927\u304D\u306A\u516C\u5712\u3068\u7F8E\u3057\u3044\u5DDD","\u5927\u304D\u306A\u30C7\u30D1\u30FC\u30C8","\u904A\u5712\u5730"],answer:"\u5927\u304D\u306A\u516C\u5712\u3068\u7F8E\u3057\u3044\u5DDD",explanation:'"There is a big park and a beautiful river" \u3068\u3042\u308A\u307E\u3059\u3002'},{id:"q2",title:"\u753A\u306B\u30B3\u30F3\u30D3\u30CB\u30A8\u30F3\u30B9\u30B9\u30C8\u30A2\u306F\u3042\u308A\u307E\u3059\u304B\uFF1F",options:["\u306F\u3044\u30011\u8ED2\u3042\u308B","\u3044\u3044\u3048\u30011\u8ED2\u3082\u306A\u3044","\u305F\u304F\u3055\u3093\u3042\u308B"],answer:"\u3044\u3044\u3048\u30011\u8ED2\u3082\u306A\u3044",explanation:`"there aren't any convenience stores here" \u3068\u3042\u308A\u307E\u3059\u3002`},{id:"q3",title:"\u7B46\u8005\u306E\u5BB6\u306E\u8FD1\u304F\u306B\u306F\u4F55\u304C\u3042\u308A\u307E\u3059\u304B\uFF1F",options:["\u56F3\u66F8\u9928","\u5C0F\u3055\u306A\u98DF\u6599\u96D1\u8CA8\u5E97\uFF08grocery store\uFF09","\u75C5\u9662"],answer:"\u5C0F\u3055\u306A\u98DF\u6599\u96D1\u8CA8\u5E97\uFF08grocery store\uFF09",explanation:'"There is a small grocery store near my house" \u3068\u3042\u308A\u307E\u3059\u3002'}]},{id:"g1-p116",grade:1,index:116,title:"\u52D5\u7269\u5712\u3067\u30E9\u30A4\u30AA\u30F3\u3092\u63A2\u305D\u3046",body:"Let's go to the zoo! There are three quokkas next to the gate. They are very popular. How can we find the lions? Look at this map. There is a big pond over there. The lions are near the pond. Are there any pandas in this zoo? No, there aren't. Let's check the popular quokkas first!",wordCount:56,questions:[{id:"q1",title:"\u30B2\u30FC\u30C8\u306E\u96A3\u306B\u306F\u4F55\u304C\u3044\u307E\u3059\u304B\uFF1F",options:["\u30E9\u30A4\u30AA\u30F3","\u30D1\u30F3\u30C0","3\u5339\u306E\u30AF\u30AA\u30C3\u30AB"],answer:"3\u5339\u306E\u30AF\u30AA\u30C3\u30AB",explanation:'"There are three quokkas next to the gate" \u3068\u3042\u308A\u307E\u3059\u3002'},{id:"q2",title:"\u30E9\u30A4\u30AA\u30F3\u306E\u5834\u6240\u3092\u3069\u306E\u3088\u3046\u306B\u3057\u3066\u63A2\u3057\u307E\u3059\u304B\uFF1F",options:["\u5148\u751F\u306B\u805E\u304F","\u5730\u56F3\u3092\u898B\u308B","\u9CF4\u304D\u58F0\u3092\u805E\u304F"],answer:"\u5730\u56F3\u3092\u898B\u308B",explanation:'"Look at this map" \u3068\u3042\u308A\u307E\u3059\u3002'},{id:"q3",title:"\u30E9\u30A4\u30AA\u30F3\u306F\u3069\u3053\u306B\u3044\u307E\u3059\u304B\uFF1F",options:["\u30B2\u30FC\u30C8\u306E\u96A3","\u6C60\u306E\u8FD1\u304F","\u6728\u306E\u4E0A"],answer:"\u6C60\u306E\u8FD1\u304F",explanation:'"The lions are near the pond" \u3068\u3042\u308A\u307E\u3059\u3002'}]},{id:"g1-p117",grade:1,index:117,title:"\u56F3\u66F8\u9928\u306E\u4F7F\u3044\u65B9",body:"Excuse me. Is there a library near here? Yes, there is. How can I get there? Go straight and turn right at the school office. You can see it on your left. It is next to the music room. There are many interesting books there. How many computers are there? There are five. Can I use one? Yes.",wordCount:58,questions:[{id:"q1",title:"\u7B46\u8005\u306F\u3069\u3053\u3092\u63A2\u3057\u3066\u3044\u307E\u3059\u304B\uFF1F",options:["\u97F3\u697D\u5BA4","\u56F3\u66F8\u9928","\u4E8B\u52D9\u5BA4"],answer:"\u56F3\u66F8\u9928",explanation:'"Is there a library near here?" \u3068\u3042\u308A\u307E\u3059\u3002'},{id:"q2",title:"\u3069\u3053\u3067\u53F3\u306B\u66F2\u304C\u308A\u307E\u3059\u304B\uFF1F",options:["\u6700\u521D\u306E\u89D2","\u4E8B\u52D9\u5BA4\uFF08school office\uFF09\u306E\u3068\u3053\u308D","\u968E\u6BB5\u306E\u3068\u3053\u308D"],answer:"\u4E8B\u52D9\u5BA4\uFF08school office\uFF09\u306E\u3068\u3053\u308D",explanation:'"turn right at the school office" \u3068\u3042\u308A\u307E\u3059\u3002'},{id:"q3",title:"\u56F3\u66F8\u9928\u306B\u306F\u30B3\u30F3\u30D4\u30E5\u30FC\u30BF\u304C\u4F55\u53F0\u3042\u308A\u307E\u3059\u304B\uFF1F",options:["1\u53F0","5\u53F0","10\u53F0"],answer:"5\u53F0",explanation:'"There are five" \u3068\u3042\u308A\u307E\u3059\u3002'}]},{id:"g1-p118",grade:1,index:118,title:"\u30C0\u30CB\u30A8\u30EB\u306E\u98DB\u884C\u6A5F\u65C5\u884C",body:"Daniel is from the U.S. How does he go back to his country? He goes by plane. There are many passengers on the flight. How long does it take from Tokyo to New York? It takes about twelve hours. Is there a meal on the plane? Yes, there is. He likes plane meals very much. He is excited.",wordCount:58,questions:[{id:"q1",title:"\u30C0\u30CB\u30A8\u30EB\u306F\u3069\u306E\u3088\u3046\u306B\u3057\u3066\u6BCD\u56FD\u3078\u5E30\u308A\u307E\u3059\u304B\uFF1F",options:["\u8239","\u98DB\u884C\u6A5F","\u30D0\u30B9"],answer:"\u98DB\u884C\u6A5F",explanation:'"He goes by plane" \u3068\u3042\u308A\u307E\u3059\u3002'},{id:"q2",title:"\u6771\u4EAC\u304B\u3089\u30CB\u30E5\u30FC\u30E8\u30FC\u30AF\u307E\u3067\u3069\u306E\u304F\u3089\u3044\u6642\u9593\u304C\u304B\u304B\u308A\u307E\u3059\u304B\uFF1F",options:["3\u6642\u9593","8\u6642\u9593","\u7D0412\u6642\u9593"],answer:"\u7D0412\u6642\u9593",explanation:'"It takes about twelve hours" \u3068\u3042\u308A\u307E\u3059\u3002'},{id:"q3",title:"\u6A5F\u5185\u306B\u98DF\u4E8B\uFF08meal\uFF09\u306F\u30  snacks. Daniel is looking at a vending machine. \u201COh, this machine is selling hot corn soup in a can!\u201D He is buying one for Ken. Ken is feeling cold, so he is very happy to get the warm soup. They are talking about their plans for February.",wordCount:75,questions:[{id:"q1",title:"\u30B1\u30F3\u30C8\u3068\u30C0\u30CB\u30A8\u30EB\u306F\u4ECA\u3001\u3069\u3053\u306B\u3044\u307E\u3059\u304B\uFF1F",options:["\u516C\u5712","\u99C5\u306E\u30DB\u30FC\u30E0","\u30B3\u30F3\u30D3\u30CB"],answer:"\u99C5\u306E\u30DB\u30FC\u30E0",explanation:'"waiting for a train at the station" \u3068\u3042\u308A\u307E\u3059\u3002'},{id:"q2",title:"\u30C0\u30CB\u30A8\u30EB\u306F\u81EA\u52D5\u8CA9\u58F2\u6A5F\u3067\u4F55\u3092\u8CB7\u3063\u3066\u3044\u307E\u3059\u304B\uFF1F",options:["\u51B7\u305F\u3044\u30B3\u30FC\u30E9","\u6E29\u304B\u3044\u30B3\u30FC\u30F3\u30B9\u30FC\u30D7","\u30EA\u30F3\u30B4\u30B8\u30E5\u30FC\u30B9"],answer:"\u6E29\u304B\u3044\u30B3\u30FC\u30F3\u30B9\u30FC\u30D7",explanation:'"hot corn soup in a can" \u3068\u3042\u308A\u307E\u3059\u3002'},{id:"q3",title:"\u4E8C\u4EBA\u306F\u4ECA\u3001\u4F55\u306B\u3064\u3044\u3066\u8A71\u3057\u3066\u3044\u307E\u3059\u304B\uFF1F",options:["1\u6708\u306E\u5BBF\u984C","2\u6708\u306E\u4E88\u5B9A","\u6628\u65E5\u306E\u6669\u3054\u306F\u3093"],answer:"2\u6708\u306E\u4E88\u5B9A",explanation:'"talking about their plans for February" \u3068\u3042\u308A\u307E\u3059\u3002'}]},{id:"g1-p135",grade:1,index:135,title:"\u65B0\u3057\u3044\u5B66\u671F\u306E\u59CB\u307E\u308A",body:"The winter vacation is ending, and the new term is starting today. Many students are walking to school. They are carrying heavy bags and talking with their friends. Mao and Emily are meeting in front of the school gate. \u201CHappy New Year! Are you enjoying the snowy morning?\u201D Mao is asking. Emily is nodding with a big smile. They are walking into the classroom together. They are ready to study hard this year!",wordCount:73,questions:[{id:"q1",title:"\u4ECA\u3001\ 063\u305F\u304B\u3089","\u304A\u8179\u304C\u7A7A\u3044\u3066\u3044\u306A\u304B\u3063\u305F\u304B\u3089"],answer:"\u5473\u304C\u3068\u3066\u3082\u5F37\u304B\u3063\u305F\u304B\u3089",explanation:'"the taste was very strong" \u3068\u3042\u308A\u307E\u3059\u3002'}]},{id:"g1-p139",grade:1,index:139,title:"\u30D5\u30A3\u30F3\u30E9\u30F3\u30C9\u306E\u9577\u3044\u591C",body:"Winter in Finland was very interesting. Miki enjoyed the long nights there. The sun didn't rise until 11 a.m. in winter. Then, the sun set at about 2 p.m. She didn't know that fact before the trip. In June, the sun doesn't go down all day. This is called the \u201Cmidnight sun.\u201D Finnish people play outside all day in summer. Nature is very powerful. Miki learned many things about the earth's seasons.",wordCount:72,questions:[{id:"q1",title:"\u51AC\u306E\u30D5\u30A3\u30F3\u30E9\u30F3\u30C9\u3067\u3001\u592A\u967D\u304C\u6607\u308B\u306E\u306F\u4F55\u6642\u3054\u308D\u3067\u3059\u304B\uFF1F",options:["\u5348\u524D7\u6642","\u5348\u524D11\u6642","\u5348\u5F8C2\u6642"],answer:"\u5348\u524D11\u6642",explanation:`"The sun didn't rise until 11 a.m." \u3068\u3042\u308A\u307E\u3059\u3002`},{id:"q2",title:"\u30DF\u30AD\u306F\u3053\u306E\u4E8B\u5B9F\u306B\u3064\u3044\u3066\u3069\u3046\u601D\u3063\u3066\u3044\u307E\u3057\u305F\u304B\uFF1F",options:["\u4EE5\u524D\u304B\u3089\u77E5\u3063\u3066\u3044\u305F","\u77E5\u3089\u306A\u304B\u3063\u305F","\u5168\u304F\u8208\u5473\u304C\u306A\u304B\u3063\u305F"],answer:"\u77E5\u3089\u306A\u304B\u3063\u305F",explanation:`"She didn't know that fact before the trip" \u3068\u3042\u308A\u307E\u3059\u3002`},{id:"q3",title:"6\u6708\u306E\u30D5\u30A3\u30F3\u30E9\u30F3\u30C9\u306F\u3069\u3046\u306A\u308A\u307E\u3059\u304B\uFF1F",options:["\u4E00\u65E5\u4E2D\u592A\u967D\u304C\u6C88\u307E\u306A\u3044","\u4E00\u65E5\u4E2D\u6697\u3044","\u305A\u3063\u3068\u96EA\u304C\u964D\u308B"],answer:"\u4E00\u65E5\u4E2D\u592A\u967D\u304C\u6C88\u307E\u306A\u3044",explanation:`"the sun doesn't go down all day" \u3068\u3042\u308A\u307E\u3059\u3002`}]},{id:"g1-p140",grade:1,index:140,title:"\u30CA\u30DD\u30EC\u30AA\u30F3\u306E\u8EAB\u9577\u306E\u771F\u5B9F",body:"Napoleon was a very famous leader in history. Many people think he was a short man. However, he was not short. He was about 168cm tall. This was not short for a man at that time. Many people made a mistake about his height. Napoleon was a very strong and active person. He had a great influence on the world. It is important for us to check information carefully. History is often very surprising.",wordCount:74,questions:[{id:"q1",title:"\u591A\u304F\u306E\u4EBA\u306F\u30CA\u30DD\u30EC\u30AA\u30F3\u306E\u8EAB\u9577\u306B\u3064\u3044\u3066\u3069\u3046\u601D\u3063\u3066\u3044\u307E\u3059\u304B\uFF1F",options:["\u80CC\u304C\u9AD8\u3044","\u80CC\u304C\u4F4E\u3044","\u666E\u901A\u304F\u3089\u3044"],answer:"\u80CC\u304C\u4F4E\u3044",explanation:'"Many people think he was a short man" \u3068\u3042\u308A\u307E\u3059\u3002'},{id:"q2",title:"\u5B9F\u969B\u306E\u5F7C\u306E\u8EAB\u9577\u306F\u7D04\u4F55cm\u3067\u3057\u305F\u304B\uFF1F",options:["150cm","168cm","180cm"],answer:"168cm",explanation:'"He was about 168cm tall" \u3068\u3042\u308A\u307E\u3059\u3002'},{id:"q3",title:"\u7B46\u8005\u306F\u60C5\u5831\u306E\u78BA\u8A8D\u306B\u3064\u3044\u3066\u4F55\u3068\u8A00\u3063\u3066\u3044\u307E\u3059\u304B\uFF1F",options:["\u4E0D\u8981\u3067\u3042\u308B","\u91CD\u8981\u3067\u3042\u308B","\u96E3\u3057\u3044"],answer:"\u91CD\u8981\u3067\u3042\u308B",explanation:'"It is important for us to check information carefully" \u3068\u3042\u308A\u307E\u3059\u3002'}]},{id:"g1-p141",grade:1,index:141,title:"\u590F\u76EE\u6F31\u77F3\u306E\u8133\u306E\u79D8\u5BC6",body:"Natsume Soseki was a very famous Japanese writer. He wrote many great books like \u201CI Am a Cat.\u201D Do you know where his brain is now? It is in Tokyo University. It is in a jar with special liquid. Doctors study his brain for medical science even now. He was a very smart man. Many people respect him and read his books. His stories were very popular in the Meiji era and today.",wordCount:73,questions:[{id:"q1",title:"\u590F\u76EE\u6F31\u77F3\u306F\u4F55\u3068\u3057\u3066\u6709\u540D\u3067\u3059\u304B\uFF1F",options:["\u753B\u5BB6","\u4F5C\u5BB6","\u533B\u8005"],answer:"\u4F5C\u5BB6",explanation:'"a very famous Japanese writer" \u3068\u3042\u308A\u307E\u3059\u3002'},{id:"q2",title:"\u5F7C\u306E\u8133\u306F\u73FE\u5728\u3069\u3053\u306B\u3042\u308A\u307E\u3059\u304B\uFF1F",options:["\u304A\u5893\u306E\u4E2D","\u6771\u4EAC\u5927\u5B66","\u535A\u7269\u9928"],answer:"\u6771\u4EAC\u5927\u5B66",explanation:'"It is in Tokyo University" \u3068\u3042\u308A\u307E\u3059\u3002'},{id:"q3",title:"\u306A\u305C\u5F7C\u306E\u8133\u306F\u4FDD\u7BA1\u3055\u308C\u3066\u3044\u308B\u306E\u3067\u3059\u304B\uFF1F",options:["\u8A18\u5FF5\u54C1\u3068\u3057\u3066","\u533B\u5B66\u306E\u7814\u7A76\u306E\u305F\u3081","\u9B54\u6CD5\u306E\u305F\u3081"],answer:"\u533B\u5B66\u306E\u7814\u7A76\u306E\u305F\u3081",explanation:'"Doctors study his brain for medical science" \u3068\u3042\u308A\u307E\u3059\u3002'}]},{id:"g1-p142",grade:1,index:142,title:"\u975E\u5E38\u968E\u6BB5\u306E\u5DE6\u56DE\u308A\u306E\u30EB\u30FC\u30EB",body:"Look at the emergency stairs in big buildings. People use them during a fire or an earthquake. These stairs are usually \u201Cleft-hand turn.\u201D Why? Because people feel safe with left-hand turns. This is a very important rule for our safety. Engineers thought about human feelings carefully. There are many smart rules in our daily lives. We should follow the rules to stay safe in an emergency. People were smarter in the past, too.",wordCount:73,questions:[{id:"q1",title:"\u975E\u5E38\u968E\u6BB5\u3092\u4E0B\u308A\u308B\u969B\u3001\u901A\u5E38\u3069\u306E\u3088\u3046\u306A\u56DE\u8EE2\u306B\u306A\u308A\u307E\u3059\u304B\uFF1F",options:["\u53F3\u56DE\u308A","\u5DE6\u56DE\u308A","\u76F4\u7DDA"],answer:"\u5DE6\u56DE\u308A",explanation:'"left-ha ter to cool big computers" \u3068\u3042\u308A\u307E\u3059\u3002'},{id:"q3",title:"AI\u3078\u306E5\u3064\u306E\u8CEA\u554F\u3067\u3001\u7D04\u3069\u308C\u304F\u3089\u3044\u306E\u91CF\u3092\u4F7F\u3044\u307E\u3059\u304B\uFF1F",options:["50ml","500ml","5\u30EA\u30C3\u30C8\u30EB"],answer:"500ml",explanation:'"five questions to AI use about 500ml of water" \u3068\u3042\u308A\u307E\u3059\u3002'}]},{id:"g1-p145",grade:1,index:145,title:"\u30CF\u30C1\u30DF\u30C4\u306E\u9A5A\u304F\u3079\u304D\u5BFF\u547D",body:"Honey is the king of food. It is very sweet and good for our health. Honey does not go bad for a very long time. For example, some people found honey from 3,000 years ago in Egypt. It was still good to eat! It was an amazing discovery. We can keep honey in our kitchen for many years. It is a wonderful natural food from bees. Many people liked to eat it in ancient times.",wordCount:75,questions:[{id:"q1",title:"\u30CF\u30C1\u30DF\u30C4\u306F\u4F55\u306E\u738B\u69D8\u3060\u3068\u8A00\u308F\u308C\u3066\u3044\u307E\u3059\u304B\uFF1F",options:["\u98DF\u3079\u7269\u306E\u738B\u69D8","\u7518\u3044\u3082\u306E\u306E\u738B\u69D8","\u866B\u306E\u738B\u69D8"],answer:"\u98DF\u3079\u7269\u306E\u738B\u69D8",explanation:'"Honey is the king of food" \u3068\u3042\u308A\u307E\u3059\u3002'},{id:"q2",title:"\u30CF\u30C1\u30DF\u30C4\u306F\u7D04\u4F55\u5E74\u7D4C\u3063\u3066\u3082\u8150\u3089\u306A\u3044\u3068\u8A00\u308F\u308C\u3066\u3044\u307E\u3059\u304B\uFF1F",options:["30\u5E74","300\u5E74","3,000\u5E74"],answer:"3,000\u5E74",explanation:'"honey from 3,000 years ago" \u3068\u3042\u308A\u307E\u3059\u3002'},{id:"q3",title:"\u30A8\u30B8\u30D7\u30C8\u3067\u898B\u3064\u304B\u3063\u305F3,000\u5E74\u524D\u306E\u30CF\u30C1\u30DF\u30C4\u306F\u3069\u3046\u3067\u3057\u305F\u304B\uFF1F",options:["\u307E\u3060\u98DF\u3079\u308B\u3053\u3068\u304C\u3067\u304D\u305F","\u6BD2\u304C\u3042\u3063\u305F","\u77F3\u306E\u3088\u3046\u306B\u786C\u304B\u3063\u305F"],answer:"\u307E\u3060\u98DF\u3079\u308B\u3053 re very cold. Grandma Baba said, \u201CI have a good idea. Let's jump on the bed! It will make us warm.\u201D So, they jumped and jumped together. It was very fun and they were not cold anymore. But then, they heard a loud sound, \u201CCRACK!\u201D The bed was not strong enough. The legs of the bed broke. They were very surprised.",wordCount:79,questions:[{id:"q1",title:"\u305D\u306E\u65E5\u306F\u3069\u306E\u3088\u3046\u306A\u5929\u6C17\u3067\u3057\u305F\u304B\uFF1F",options:["\u6691\u304F\u3066\u6674\u308C\u305F\u65E5","\u98A8\u304C\u5F37\u3044\u96E8\u306E\u65E5","\u3068\u3066\u3082\u5BD2\u304F\u3066\u96EA\u306E\u65E5"],answer:"\u3068\u3066\u3082\u5BD2\u304F\u3066\u96EA\u306E\u65E5",explanation:'"It was a very cold and snowy day" \u3068\u3042\u308A\u307E\u3059\u3002'},{id:"q2",title:"\u3070\u3070\u3070\u3042\u3061\u3083\u3093\u306F\u4F55\u3092\u3057\u3066\u6E29\u307E\u308D\u3046\u3068\u63D0\u6848\u3057\u307E\u3057\u305F\u304B\uFF1F",options:["\u304A\u98A8\u5442\u306B\u5165\u308B","\u30D9\u30C3\u30C9\u306E\u4E0A\u3067\u30B8\u30E3\u30F3\u30D7\u3059\u308B","\u30B9\u30FC\u30D7\u3092\u4F5C\u308B"],answer:"\u30D9\u30C3\u30C9\u306E\u4E0A\u3067\u30B8\u30E3\u30F3\u30D7\u3059\u308B",explanation:`"Let's jump on the bed!" \u3068\u3042\u308A\u307E\u3059\u3002`},{id:"q3",title:"\u6700\u5F8C\u306B\u4F55\u304C\u8D77\u304D\u307E\u3057\u305F\u304B\uFF1F",options:["\u30D9\u30C3\u30C9\u306E\u811A\u304C\u6298\u308C\u305F","\u6CE5\u68D2\u304C\u6765\u305F","\u307F\u3093\u306A\u3067\u5BDD\u305F"],answer:"\u30D9\u30C3\u30C9\u306E\u811A\u304C\u6298\u308C\u305F",explanation:'"The legs of the bed broke" \u3068\u3042\u308A\u307E\u3059\u3002'}]},{id:"g1-p148",grade:1,index:148,title:"\u58CA\u308C\u305F\u30D9\u30C3\u30C9\u3068\u5927\u304D\u306A\u305D\u308A",body:"Grandma Baba looked at the broken bed and smiled. She said, \u201CDon't worry. We can make a big sleigh with this bed!\u201D She took a saw and cut off the broken legs. The bed became a wonderful sleigh. They took the sleigh to the big hill near the house. Everyone got on the sleigh and shouted, \u201CWhee!\u201D The sleigh went down the slope very fast. They enjoyed the exciting ride in the snow. Their idea was very good.",wordCount:78,questions:[{id:"q1",title:"\u3070\u3070\u3070\u3042\u3061\u3083\u3093\u306F\u58CA\u308C\u305F\u30D9\u30C3\u30C9\u3092\u4F55\u306B\u4F5C\u308A\u5909\u3048\u307E\u3057\u305F\u304B\uFF1F",options:["\u65B0\u3057\u3044\u673A","\u5927\u304D\u306A\u305D\u308A","\u72AC\u306E\u5BB6"],answer:"\u5927\u304D\u306A\u305D\u308A",explanation:'"We can make a big sleigh with this bed" \u3068\u3042\u308A\u307E\u3059\u3002'},{id:"q2",title:"\u5F7C\u3089\u306F\u3069\u3053\u3078\u884C\u304D\u307E\u3057\u305F\u304B\uFF1F",options:["\u8FD1\u304F\u306E\u5927\u304D\u306A\u4E18","\u9759\u304B\u306A\u56F3\u66F8\u9928","\u753A\u306E\u30B9\u30FC\u30D1\u30FC"],answer:"\u8FD1\u304F\u306E\u5927\u304D\u306A\u4E18",explanation:'"the big hill near the house" \u3068\u3042\u308A\u307E\u3059\u3002'},{id:"q3",title:"\u96EA\u306E\u4E2D\u3067\u306E\u4E57\u308A\u5FC3\u5730\u306F\u3069\u3046\u3067\u3057\u305F\u304B\uFF1F",options:["\u3068\u3066\u3082\u9045\u304B\u3063\u305F","\u3068\u3066\u3082\u308F\u304F\u308F\u304F\u3057\u305F","\u6016\u304F\u3066\u6CE3\u3044\u305F"],answer:"\u3068\u3066\u3082\u308F\u304F\u308F\u304F\u3057\u305F",explanation:'"They enjoyed the exciting ride" \u3068\u3042\u308A\u307E\u3059\u3002'}]},{id:"g1-p149",grade:1,index:149,title:"\u5742\u9053\u3067\u30DD\u30AB\u30DD\u30AB",body:"The sleigh came to the end of the slope. They were very happy, but they were at the bottom of the hill. Grandma Baba said, \u201CNow, let's pull the sleigh and go back up!\u201D Everyone pulled the heavy sleigh together. They shouted, \u201CHeave ho, heave ho!\u201D It was hard work, but their bodies became very warm. They reached the top of the hill and jumped into the bed. They were very sleepy and fell asleep soon. It was a wonderful winter day.",wordCount:82,questions:[{id:"q1",title:"\u305D\u308A\u304C 5F\u304B\uFF1F",options:["\u53E4\u3044\u624B\u7D19","\u304A\u6BCD\u3055\u3093\u306E\u53E4\u3044\u5199\u771F","\u30C6\u30CB\u30B9\u306E\u30E9\u30B1\u30C3\u30C8"],answer:"\u304A\u6BCD\u3055\u3093\u306E\u53E4\u3044\u5199\u771F",explanation:'"I found an old photo" "It was a photo of my mother" \u3068\u3042\u308A\u307E\u3059\u3002'},{id:"q2",title:"30\u5E74\u524D\u306E\u304A\u6BCD\u3055\u3093\u306F\u4F55\u90E8\u306B\u5165\u3063\u3066\u3044\u307E\u3057\u305F\u304B\uFF1F",options:["\u5439\u594F\u697D\u90E8","\u6599\u7406\u90E8","\u30C6\u30CB\u30B9\u90E8"],answer:"\u30C6\u30CB\u30B9\u90E8",explanation:'"I was in the tennis club" \u3068\u3042\u308A\u307E\u3059\u3002'},{id:"q3",title:"\u4ECA\u306E\u304A\u6BCD\u3055\u3093\u306E\u8077\u696D\u306F\u4F55\u3067\u3059\u304B\uFF1F",options:["\u5148\u751F","\u533B\u8005","\u82B1\u5C4B"],answer:"\u533B\u8005",explanation:'"Now she is a busy doctor" \u3068\u3042\u308A\u307E\u3059\u3002'}]},{id:"g1-p151",grade:1,index:151,title:"\u99C5\u5F01\u306E\u65C5\u306E\u601D\u3044\u51FA",body:"Last spring vacation, I traveled to Kyoto by train with my family. At the station, we saw many kinds of bentos. They were \u201Cekibens.\u201D There are about 2,000 kinds of ekibens in Japan! I bought a bento with many local vegetables. It was very delicious and colorful. My father bought an unagi bento. We ate them on the train and looked at the beautiful view from the window. It was the best part of our trip.",wordCount:76,questions:[{id:"q1",title:"\u65E5\u672C\u306B\u306F\u7D04\u4F55\u7A2E\u985E\u306E\u99C5\u5F01\u304C\u3042\u308A\u307E\u3059\u304B\uFF1F",options:["20\u7A2E\u985E","200\u7A2E\u985E","2,000\u7A2E\u985E"],answer:"2,000\u7A2E\u985E",explanation:'"about 2,000 kinds of ekibens" \u3068\u3042\u308A\u307E\u3059\u3002'},{id:"q2",title:"\u7B46\u8005\u306F\u3069\u306E\u3088\u3046\u306A\u99C5\u5F01\u3092\u8CB7\u3044\u307E\u3057\u305F\u304B\uFF1F",options:["\u5730\u5143\u306E\u91CE\u83DC\u304C\u305F\u304F\u3055\u3093\u5165\u3063\u305F\u5F01\u5F53","\u3046\u306A\u304E\u5F01\u5F53","\u30B5\u30F3\u30C9\u30A4\u30C3\u30C1"],answer:"\u5730\u5143\u306E\u91CE\u83DC\u304C\u305F\u304F\u3055\u3093\u5165\u3063\u305F\u5F01\u5F53",explanation:'"a bento with many local vegetables" \u3068\u3042\u308A\u307E\u3059\u3002'},{id:"q3",title:"\u5F7C\u3089\u306F\u3069\u3053\u3067\u99C5\u5F01\u3092\u98DF\u3079\u307E\u3057\u305F\u304B\uFF1F",options:["\u4EAC\u90FD\u306E\u304A\u5BFA","\u96FB\u8ECA\u306E\u4E2D","\u99C5\u306E\u30EC\u30B9\u30C8\u30E9\u30F3"],answer:"\u96FB\u8ECA\u306E\u4E2D",explanation:'"We ate them on the train" \u3068\u3042\u308A\u307E\u3059\u3002'}]},{id:"g1-p152",grade:1,index:152,title:"\u30B8\u30E3\u30AF\u30BD\u30F3\u306E\u5922\u3068\u52C7\u6C17",body:"Do you remember Jackson? He is a brave boy in Kenya. Every morning, he walked fifteen kilometers to school with his brother. It took two hours! Why did he walk so far? Because he had a big dream. He wanted to be a pilot. He studied hard at school every day. Now, he is a high school student and he is still studying hard for his dream. His story gives us a lot of courage. We should do our best, too.",wordCount:81,questions:[{id:"q1",title:"\u30B8\u30E3\u30AF\u30BD\u30F3\u306F\u5B66\u6821\u307E\u3067\u6BCE\u65E5\u4F55\u30AD\u30ED\u6B69\u3044\u3066\u3044\u307E\u3057\u305F\u304B\uFF1F",options:["2\u30AD\u30ED","15\u30AD\u30ED","50\u30AD\u30ED"],answer:"15\u30AD\u30ED",explanation:'"he walked fifteen kilometers to school" \u3068\u3042\u308A\u307E\u3059\u3002'},{id:"q2",title:"\u5F7C\u306E\u5C06\u6765\u306E\u5922\u306F\u4F55\u3067\u3057\u305F\u304B\uFF1F",options:["\u5148\u751F","\u533B\u8005","\u30D1\u30A4\u30ED\u30C3\u30C8"],answer:"\u30D1\u30A4\u30ED\u30C3\u30C8",explanation:'"He wanted to be a pilot" \u3068\u3042\u308A\u307E\u3059\u3002'},{id:"q3",title:"\u5F7C\u306F\u4ECA\u3001\u4F55\u3092\u3057\u3066\u3044\u307E\u3059\u304B\uFF1F",options:["\u3059\u3067\u306B\u30D1\u30A4\u30ED\u30C3\u30C8\u306B\u306A\u3063\u305F","\u9AD8\u6821\u751F\u3067\u3001\u4ECA\u3082\u52C9\u5F37\u3092\u9811\u5F35\u3063\u3066\u3044\u308B","\u65E5\u672C\u306B\u4F4F\u3093\u3067\u3044\u308B"],answer:"\u9AD8\u6821\u751F\u3067\u3001\u4ECA\u3082\u52C9\u5F37\u3092\u9811\u5F35\u3063\u3066\u3044\u308B",explanation:'"he is a high school student and he is still studying hard" \u3068\u3042\u308A\u307E\u3059\u3002'}]},{id:"g1-p153",grade:1,index:153,title:"\u5B87\u5B99\u306E\u5302\u3044\u3092\u899A\u3048\u3066\u3044\u308B\uFF1F",body:"Astronauts went to space and did many things. When they came back, they talked about a strange thing. It was the smell of space. Do you remember the smell? It was like \u201Cburnt metal.\u201D Some astronauts said it was like a steak, too. Space is very far from us, but we can know about it through their stories. Science is very interesting. I want to go to space and smell it someday. What do you think about it?",wordCount:78,questions:[{id:"q1",title:"\u5B87\u5B99\u98DB\u884C\u58EB\u305F\u3061\u306F\u3001\u5B87\u5B99\u306E\u5302\u3044\u306F\u4F55\u306B\u4F3C\u3066\u3044\u308B\u3068\u8A00\u3044\u307E\u3057\u305F\u304B\uFF1F",options:["\u82B1\u306E\u5302\u3044","\u713C\u3051\u305F\u91D1\u5C5E\u306E\u5302\u3044","\u53E4\u3044\u672C\u306E\u5302\u3044"],answer:"\u713C\u3051\u305F\u91D1\u5C5E\u306E\u5302\u3044",explanation:`"It was like 'burnt metal'" \u3068\u3042\u308A\u307E\u3059\u3002`},{id:"q2",title:"\u4ED6\u306B\u3069\u306E\u3088\u3046\u306A\u5302\u3044\u306B\u4F8B\u3048\u3089\u308C\u307E\u3057\u305F\u304B\uFF1F",options:["\u30B9\u30C6\u30FC\u30AD","\u9B5A\u6599\u7406","\u30C1\u30E7\u30B3\u30EC\u30FC\u30C8"],answer:"\u30B9\u30C6\u30FC\u30AD",explanation:'"it was like a steak, too" \u3068\u3042\u308A\u307E\u3059\u3002'},{id:"q3",title:"\u7B46\u8005\u306F\u5C06\u6765\u4F55\u3092\u3057\u305F\u3044\u3068\u8A00\u3063\u3066\u3044\u307E\u3059\u304B\uFF1F",options:["\u5B87\u5B99\u98DB\u884C\u58EB\u306E\u7269\u8A9E\u3092\u66F8\u304F","\u5B87\u5B99\u306B\u884C\u3063\u3066\u5302\u3044\u3092\u55C5\u3050","\u79D1\u5B66\u306E\u5148\u751F\u306B\u306A\u308B"],answer:"\u5B87\u5B99\u306B\u884C\u3063\u3066\u5302\u3044\u3092\u55C5\u3050",explanation:'"I want to go to space and smell it someday" \u3068\u3042\u308A\u307E\u3059\u3002'}]},{id:"g1-p154",grade:1,index:154,title:"3000\u5E74\u524D\u306E\u30CF\u30C1\u30DF\u30C4",body:"Honey is a very special food. It does not go bad for a long time. Doctors found some honey in an old building in Egypt. It was about 3,000 years old! Was it bad? No, it was still good. People could eat it. Honey is the king of food. It is good for our health, too. I eat some honey every morning. It makes me active and happy. Do you like sweet honey?",wordCount:73,questions:[{id:"q1",title:"\u30CF\u30C1\u30DF\u30C4\u306F\u3069\u306E\u304F\u3089\u3044\u306E\u9593\u3001\u8150\u3089\u306A\u3044\u3068\u8A00\u308F\u308C\u3066\u3044\u307E\u3059\u304B\uFF1F",options:["30\u5E74","300\u5E74","3,000\u5E74"],answer:"3,000\u5E74",explanation:'"It was about 3,000 years old" \u3068\u3042\u308A\u307E\u3059\u3002'},{id:"q2",title:"\u3069\u3053\u306E\u56FD\u306E\u53E4\u3044\u5EFA\u7269\u3067\u30CF\u30C1\u30DF\u30C4\u304C\u898B\u3064\u304B\u308A\u307E\u3057\u305F\u304B\uFF1F",options:["\u65E5\u672C","\u30A8\u30B8\u30D7\u30C8","\u30A2\u30E1\u30EA\u30AB"],answer:"\u30A8\u30B8\u30D7\u30C8",explanation:'"in an old building in Egypt" \u3068\u3042\u308A\u307E\u3059\u3002'},{id:"q3",title:"\u305D\u306E\u898B\u3064\u304B\u3063\u305F\u30CF\u30C1\u30DF\u30C4\u306E\u72B6\u614B\u306F\u3069\u3046\u3067\u3057\u305F\u304B\uFF1F",options:["\u8150\u3063\u3066\u3044\u305F","\u98DF\u3079\u308B\u3053\u3068\u304C\u3067\u304D\u305F","\u77F3\u306E\u3088\u3046\u306B\u786C\u304B\u3063\u305F"],answer:"\u98DF\u3079\u308B\u3053\u3068\u304C\u3067\u304D\u305F",explanation:'"No, it was still good. People could eat it" \u3068\u3042\u308A\u307E\u3059\u3002'}]},{id:"g1-p155",grade:1,index:155,title:"\u925B\u7B46\u306E\u9577\u3044\u65C5",body:"Look at your pencil. One pencil can draw a very long line. How long is it? It is about fifty kilometers! It is like the distance from Tokyo to Narita. Pencils are very simple but great tools. I used many pencils this year. Now they are very short. They are the symbols of my hard work. I want to keep them in a small box. Do you have any short pencils in your desk?",wordCount:74,questions:[{id:"q1",title:"\u925B\u7B461\u672C\u3067\u3001\u4F55\u30AD\u30ED\u306E\u7DDA\u3092\u66F8\u304F\u3053\u3068\u304C\u3067\u304D\u307E\u3059\u304B\uFF1F",options:["5\u30AD\u30ED","15\u30AD\u30ED","50\u30AD\u30ED"],answer:"50\u30AD\u30ED",explanation:'"It is about fifty kilometers" \u3068\u3042\u308A\u307E\u3059\u3002'},{id:"q2",title:"\u7B46\u8005\u306B\u3068\u3063\u3066\u3001\u77ED\u304F\u306A\u3063\u305F\u925B\u7B46\u306F\u4F55\u306E\u30B7\u30F3\u30DC\u30EB\u3067\u3059\u304B\uFF1F",options:["\u904A\u3073\u306E\u601D\u3044\u51FA","\u4E00\u751F\u61F8\u547D\u9811\u5F35\u3063\u305F\u8A3C\uFF08\u52AA\u529B\uFF09","\u7BC0\u7D04"],answer:"\u4E00\u751F\u61F8\u547D\u9811\u5F35\u3063\u305F\u8A3C\uFF08\u52AA\u529B\uFF09",explanation:'"They are the symbols of my hard work" \u3068\u3042\u308A\u307E\u3059\u3002'},{id:"q3",title:"\u7B46\u8005\u306F\u77ED\u304F\u306A\u3063\u305F\u925B\u7B46\u3092\u3069\u3046\u3057\u305F\u3044\u3068\u8A00\u3063\u3066\u3044\u307E\u3059\u304B\uFF1F",options:["\u6368\u3066\u308B","\u53CB\u9054\u306B\u3042\u3052\u308B","\u5C0F\u3055\u306A\u7BB1\u306B\u5165\u308C\u3066\u53D6\u3063\u3066\u304A\u304F"],answer:"\u5C0F\u3055\u306A\u7BB1\u306B\u5165\u308C\u3066\u53D6\u3063\u3066\u304A\u304F",explanation:'"I want to keep them in a small box" \u3068\u3042\u308A\u307E\u3059\u3002'}]},{id:"g1-p156",grade:1,index:156,title:"\u30D1\u30F3\u30C0\u306E\u8D64\u3061\u3083\u3093\u306E1\u5E74",body:"A baby panda is only 100g at birth. It is like a small mouse. But it grows very fast. After six months, it is about ten kilograms. It eats a lot of bamboo and plays in the snow. Now, the baby panda at the zoo is one year old. It is very big and strong. Many people visited the zoo to see it. It made everyone happy. I saw it yesterday. It was very cute and active.",wordCount:77,questions:[{id:"q1",title:"\u751F\u307E\u308C\u305F\u6642\u306E\u30D1\u30F3\u30C0\u306E\u8D64\u3061\u3083\u3093\u306E\u91CD\u3055\u306F\uFF1F",options:["100g","1kg","10kg"],answer:"100g",explanation:'"A baby panda is only 100g at birth" \u3068\u3042\u308A\u307E\u3059\u3002'},{id:"q2",title:"\u751F\u5F8C6\u304B\u6708\u3067\u3001\u91CD\u3055\u306F\u7D04\u4F55\u30AD\u30ED\u306B\u306A\u308A\u307E\u3059\u304B\uFF1F",options:["1kg","10kg","100kg"],answer:"10kg",explanation:'"After six months, it is about ten kilograms" \u3068\u3042\u308A\u307E\u3059\u3002'},{id:"q3",title:"\u7B46\u8005\u306F\u6628\u65E5\u3001\u52D5\u7269\u5712\u3067\u30D1\u30F3\u30C0\u3092\u898B\u3066\u3069\u3046\u611F\u3058\u307E\u3057\u305F\u304B\uFF1F",options:["\u6016\u304B\u3063\u305F","\u7720\u305D\u3046\u3060\u3063\u305F","\u3068\u3066\u3082\u304B\u308F\u3044\u304F\u3066\u6D3B\u767A\u3060\u3063\u305F"],answer:"\u3068\u3066\u3082\u304B\u308F\u3044\u304F\u3066\u6D3B\u767A\u3060\u3063\u305F",explanation:'"It was very cute and active" \u3068\u3042\u308A\u307E\u3059\u3002'}]},{id:"g1-p157",grade:1,index:157,title:"1-B\u306E\u30AF\u30E9\u30B9\u30E1\u30FC\u30C8\u3078",body:"Dear classmates in 1-B. This year was very special for me. At first, I was very shy and I didn't have many friends. But you were always kind to me. We studied English and math together. We also played soccer in the schoolyard. I had a very good time with you. Now, the first year is ending. I am a little sad, but I am excited about the next year, too. Thank you for everything!",wordCount:75,questions:[{id:"q1",title:"\u7B46\u8005\u306F\u6700\u521D\u3001\u3069\u306E\u3088\u3046\u306A\u6027\u683C\u3067\u3057\u305F\u304B\uFF1F",options:["\u6D3B\u767A\u3060\u3063\u305F","\u6065\u305A\u304B\u3057\u304C\u308A\u5C4B\u3060\u3063\u305F","\u6012\u308A\u3063\u307D\u304B\u3063\u305F"],answer:"\u6065\u305A\u304B\u3057\u304C\u308A\u5C4B\u3060\u3063\u305F",explanation:'"I was very shy" \u3068\u3042\u308A\u307E\u3059\u3002'},{id:"q2",title:"\u30AF\u30E9\u30B9\u30E1\u30FC\u30C8\u3068\u6821\u5EAD\u3067\u4F55\u3092\u3057\u3066\u904A\u3073\u307E\u3057\u305F\u304B\uFF1F",options:["\u91CE\u7403","\u30B5\u30C3\u30AB\u30FC","\u304B\u304F\u308C\u3093\u307C"],answer:"\u30B5\u30C3\u30AB\u30FC",explanation:'"We also played soccer in the schoolyard" \u3068\u3042\u308A\u307E\u3059\u3002'},{id:"q3",title:"\u4ECA\u3001\u7B46\u8005\u306F\u3069\u306E\u3088\u3046\u306A\u6C17\u6301\u3061\u3067\u3059\u304B\uFF1F",options:["\u5C11\u3057\u5BC2\u3057\u3044\u304C\u3001\u6765\u5E74\u3082\u697D\u3057\u307F\u306B\u3057\u3066\u3044\u308B","\u52C9\u5F37\u304C\u5ACC\u3044\u3067\u6012\u3063\u3066\u3044\u308B","\u65E9\u304F\u590F\u4F11\u307F\u306B\u306A\u3063\u3066\u307B\u3057\u3044"],answer:"\u5C11\u3057\u5BC2\u3057\u3044\u304C\u3001\u6765\u5E74\u3082\u697D\u3057\u307F\u306B\u3057\u3066\u3044\u308B",explanation:'"I am a little sad, but I am excited about the next year, too" \u3068\u3042\u308A\u307E\u3059\u3002'}]},{id:"g1-p158",grade:1,index:158,title:"\u30DF\u30E9\u30FC\u5148\u751F\u3001\u3042\u308A\u304C\u3068\u3046",body:"Ms. Miller was our English teacher this year. She was from the U.K. She was very kind and her classes were always fun. She taught us many interesting things about her country. I liked her stories very much. Yesterday was her last class. We made a big thank-you card for her. She looked very happy and said, \u201CYou are great students. I'll miss you.\u201D We will never forget her and her English lessons.",wordCount:73,questions:[{id:"q1",title:"\u30DF\u30E9\u30FC\u5148\u751F\u306F\u3069\u3053\u306E\u56FD\u51FA\u8EAB\u3067\u3059\u304B\uFF1F",options:["\u30A2\u30E1\u30EA\u30AB","\u30AA\u30FC\u30B9\u30C8\u30E9\u30EA\u30A2","\u30A4\u30AE\u30EA\u30B9(U.K.)"],answer:"\u30A4\u30AE\u30EA\u30B9(U.K.)",explanation:'"She was from the U.K." \u3068\u3042\u308A\u307E\u3059\u3002'},{id:"q2",title:"\u751F\u5F92\u305F\u3061\u306F\u5148\u751F\u306E\u305F\u3081\u306B\u4F55\u3092\u4F5C\u308A\u307E\u3057\u305F\u304B\uFF1F",options:["\u5927\u304D\u306A\u611F\u8B1D\u306E\u30AB\u30FC\u30C9","\u7F8E\u5473\u3057\u3044\u30B1\u30FC\u30AD","\u6298\u308A\u7D19\u306E\u30C4\u30EB"],answer:"\u5927\u304D\u306A\u611F\u8B1D\u306E\u30AB\u30FC\u30C9",explanation:'"We made a big thank-you card for her" \u3068\u3042\u308A\u307E\u3059\u3002'},{id:"q3",title:"\u5148\u751F\u306F\u751F\u5F92\u305F\u3061\u306B\u5BFE\u3057\u3066\u6700\u5F8C\u306B\u4F55\u3068\u8A00\u3044\u307E\u3057\u305F\u304B\uFF1F",options:["\u52C9\u5F37\u3057\u306A\u3055\u3044","\u5BC2\u3057\u304F\u306A\u308A\u307E\u3059","\u3055\u3088\u3046\u306A\u3089"],answer:"\u5BC2\u3057\u304F\u306A\u308A\u307E\u3059",explanation:`"I'll miss you" \u3068\u3042\u308A\u307E\u3059\u3002`}]},{id:"g1-p159",grade:1,index:159,title:"\u6625\u4F11\u307F\u306E\u4E88\u5B9A\uFF1A\u5317\u6D77\u9053\u3078",body:"The spring vacation is starting next week. I am going to visit my grandparents in Hokkaido with my brother. We are going to go there by plane. It will be my first flight! I am a little nervous, but very excited. We are going to see many cows and eat delicious ice cream there. My grandfather is good at skiing, so he will teach me. I want to have a wonderful time in Hokkaido.",wordCount:74,questions:[{id:"q1",title:"\u7B46\u8005\u306F\u6625\u4F11\u307F\u306B\u3069\u3053\u3078\u884C\u304F\u4E88\u5B9A\u3067\u3059\u304B\uFF1F",options:["\u6C96\u7E04","\u5317\u6D77\u9053","\u30AB\u30CA\u30C0"],answer:"\u5317\u6D77\u9053",explanation:'"visit my grandparents in Hokkaido" \u3068\u3042\u308A\u307E\u3059\u3002'},{id:"q2",title:"\u305D\u3053\u3078\u3069\u306E\u3088\u3046\u306A\u624B\u6BB5\u3067\u884C\u304D\u307E\u3059\u304B\uFF1F",options:["\u8239","\u98DB\u884C\u6A5F","\u65B0\u5E79\u7DDA"],answer:"\u98DB\u884C\u6A5F",explanation:'"We are going to go there by plane" \u3068\u3042\u308A\u307E\u3059\u3002'},{id:"q3",title:"\u5411\u3053\u3046\u3067\u8AB0\u304C\u30B9\u30AD\u30FC\u3092\u6559\u3048\u3066\u304F\u308C\u308B\ "1\u5E74\u751F\uFF08\u7559\u5E74\uFF09","2\u5E74\u751F","3\u5E74\u751F"],answer:"2\u5E74\u751F",explanation:'"I will be a second-year student" \u3068\u3042\u308A\u307E\u3059\u3002'}]},{id:"g2-p1",grade:2,index:1,title:"\u30D5\u30A3\u30EC\u30F3\u30C4\u30A7\u3078\u306E\u65C5",body:`Next spring, my family is going to travel to Florence, Italy. We are going to see Michelangelo's famous statue, "David," at a museum there. It is more than five meters tall! My sister will take a lot of photos. I am going to study Italian art history before the trip. I think it will be an unforgettable experience for all of us. I can't wait to see real Renaissance art.`,wordCount:70,questions:[{id:"q1",title:"\u5BB6\u65CF\u306F\u3069\u3053\u3078\u65C5\u884C\u3059\u308B\u4E88\u5B9A\u3067\u3059\u304B\uFF1F",options:["\u30D5\u30E9\u30F3\u30B9\u306E\u30D1\u30EA","\u30A4\u30BF\u30EA\u30A2\u306E\u30D5\u30A3\u30EC\u30F3\u30C4\u30A7","\u30B9\u30DA\u30A4\u30F3\u306E\u30DE\u30C9\u30EA\u30FC\u30C9"],answer:"\u30A4\u30BF\u30EA\u30A2\u306E\u30D5\u30A3\u30EC\u30F3\u30C4\u30A7",explanation:'"travel to Florence, Italy" \u3068\u3042\u308A\u307E\u3059\u3002'},{id:"q2",title:"\u300C\u30C0\u30D3\u30C7\u50CF\u300D\u306F\u3069\u306E\u304F\u3089\u3044\u306E\u9AD8\u3055\u3067\u3059\u304B\uFF1F",options:["3\u30E1\u30FC\u30C8\u30EB\u4EE5\u4E0A","5\u30E1\u30FC\u30C8\u30EB\u4EE5\u4E0A","10\u30E1\u30FC\u30C8\u30EB\u4EE5\u4E0A"],answer:"5\u30E1\u30FC\u30C8\u30EB\u4EE5\u4E0A",explanation:'"more than five meters tall" \u3068\u3042\u308A\u307E\u3059\u3002'},{id:"q3",title:"\u65C5\u884C\u524D\u306B\u7B46\u8005\u306F\u4F55\u3092\u3059\u308B\u4E88\u5B9A\u3067\u3059\u304B\uFF1F",options:["\u30A4\u30BF\u30EA\u30A2\u8A9E\u306E\u6B4C\u3092\u7DF4\u7FD2\u3059\u308B","\u30A4\u30BF\u30EA\u30A2\u7F8E\u8853\u53F2\u3092\u52C9\u5F37\u3059\u308B","\u5F6B\u523B\u3092\u4F5C\u308B"],answer:"\u30A4\u30BF\u30EA\u30A2\u7F8E\u8853\u53F2\u3092\u52C9\u5F37\u3059\u308B",explanation:'"I am going to study Italian art history before the trip" \u3068\u     @font-face {

    .rs-phase-title { font-family: 'Oswald', 'Impact', 'Arial Narrow', 'Helvetica Condensed', sans-serif; font-size: 22px; font-weight: 600; letter-spacing: 2px; color: #e2e8f0; margin-bottom: 24px; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
    .rs-back-btn { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: #94a3b8; padding: 8px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0; }
    .rs-back-btn:hover { background: rgba(255,255,255,0.12); color: #f1f5f9; }
    /* Login */

    .rs-id-input { width: 100%; text-align: center; font-family: 'Oswald', 'Impact', 'Arial Narrow', 'Helvetica Condensed', sans-serif; font-size: 52px; font-weight: 700; letter-spacing: 12px; padding: 20px; background: rgba(255,255,255,0.04); border: 2px solid rgba(255,255,255,0.1); border-radius: 20px; color: #fbbf24; outline: none; transition: border-color 0.2s; }
    .rs-id-input:focus { border-color: #fbbf24; background: rgba(251,191,36,0.05); }
    .rs-id-input::placeholder { color: rgba(255,255,255,0.1); }
    .rs-btn-primary { width: 100%; padding: 18px; background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #0f172a; font-family: 'Oswald', 'Impact', 'Arial Narrow', 'Helvetica Condensed', sans-serif; font-size: 20px; font-weight: 700; letter-spacing: 3px; border: none; border-radius: 16px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 20px; }
    .rs-btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(251,191,36,0.4); }
    .rs-btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

    .rs-grade-btn { background: rgba(255,255,255,0.04); border: 2px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 20px 24px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; transition: all 0.2s; color: #f1f5f9; margin-bottom: 12px; }
    .rs-grade-btn:hover { border-color: #fbbf24; background: rgba(251,191,36,0.08); transform: translateX(4px); }

    .rs-grade-name { font-family: 'Oswald', 'Impact', 'Arial Narrow', 'Helvetica Condensed', sans-serif; font-size: 28px; font-weight: 700; margin-top: 2px; }

    .rs-month-card { background: rgba(255,255,255,0.04); border: 2px solid rgba(255,255,255,0.06); border-radius: 16px; padding: 16px; cursor: pointer; text-align: left; transition: all 0.2s; color: #f1f5f9; }
    .rs-month-card:hover { border-color: #fbbf24; background: rgba(251,191,36,0.06); }

    .rs-stat-val { font-size: 14px; font-weight: 900; color: #fbbf24; font-family: 'Oswald', 'Impact', 'Arial Narrow', 'Helvetica Condensed', sans-serif; }

    .rs-done-badge { color: #34d399; }

    .rs-prob-card:hover { border-color: #fbbf24; background: rgba(251,191,36,0.06); }

    .rs-prob-num { font-size: 10px; color: #64748b; font-weight: 700; }
    .rs-prob-label { font-family: 'Oswald', 'Impact', 'Arial Narrow', 'Helvetica Condensed', sans-serif; font-size: 14px; font-weight: 600; }

    .rs-prob-score { font-size: 10px; color: #34d399; font-weight: 700; }

    .rs-reading-badge { display: flex; justify-content: space-between; align-items: center; background: rgba(251,191,36,0.1); border: 1px solid rgba(251,191,36,0.2); border-radius: 12px; padding: 10px 16px; margin-bottom: 20px; }

    .rs-passage-title { font-family: 'Oswald', 'Impact', 'Arial Narrow', 'Helvetica Condensed', sans-serif; font-size: 26px; font-weight: 700; margin-bottom: 20px; color: #fbbf24; }

    .rs-start-quiz-btn { margin-top: 20px; width: 100%; padding: 18px; background: rgba(251,191,36,0.15); border: 2px solid #fbbf24; color: #fbbf24; font-family: 'Oswald', 'Impact', 'Arial Narrow', 'Helvetica Condensed', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: 3px; border-radius: 16px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .rs-start-quiz-btn:hover { background: #fbbf24; color: #0f172a; }
