const shuffle = arr => [...arr].sort(() => Math.random() - 0.5);

const speak = (text) => {
  if (!window.speechSynthesis) return;
  const doSpeak = () => {
    try {
      window.speechSynthesis.cancel();
      setTimeout(() => {
        const u = new SpeechSynthesisUtterance(text);
        u.lang = "en-US";
        u.rate = 0.82;
        const voices = window.speechSynthesis.getVoices();
        const enVoice = voices.find(v => v.lang === "en-US") ||
                        voices.find(v => v.lang.startsWith("en"));
        if (enVoice) u.voice = enVoice;
        window.speechSynthesis.speak(u);
      }, 80);
    } catch (_) {}
  };
  const voices = window.speechSynthesis.getVoices();
  if (voices.length === 0) {
    window.speechSynthesis.onvoiceschanged = () => {
      window.speechSynthesis.onvoiceschanged = null;
      doSpeak();
    };
  } else {
    doSpeak();
  }
};

const fmtTime = (ms) => {
  const s = ms / 1000;
  const m = Math.floor(s / 60);
  const sec = (s % 60).toFixed(1);
  return m > 0 ? `${m}分${String(Math.floor(s % 60)).padStart(2,"0")}.${Math.floor((ms%1000)/100)}秒` : `${sec}秒`;
};

const calcWPM = (chars, ms) => (ms > 500 ? Math.round((chars / 5) / (ms / 60000)) : 0);

const WORD_HINTS = {
  am:   "主語がIの時（現在）", is:   "主語がhe/she/itの時（現在）",
  are:  "主語がyou/we/theyの時（現在）",

  do:   "主語がI/you/we/theyの時", does: "主語がhe/she/itの時",
  did:  "doの過去形", done: "doの過去分詞",
  have: "主語がI/you/we/theyの時", has:  "主語がhe/she/itの時",
  had:  "haveの過去形",
  go:   "原形", goes: "主語がhe/she/itの時", went: "goの過去形", gone: "goの過去分詞",
  make: "原形", made: "makeの過去形・過去分詞",

  get:  "原形", got:  "getの過去形",
  see:  "原形", saw:  "seeの過去形", seen: "seeの過去分詞",
  come: "原形", came: "comeの過去形",
  give: "原形", gave: "giveの過去形", given: "giveの過去分詞",
  know: "原形", knew: "knowの過去形", known: "knowの過去分詞",
  speak:"原形", spoke:"speakの過去形", spoken:"speakの過去分詞",
  write:"原形", wrote:"writeの過去形", written:"writeの過去分詞",
};

const mkQs = (words, mode) => {
  // Detect duplicate meanings within this stage
  const jaCount = {};
  words.forEach(w => { jaCount[w.ja] = (jaCount[w.ja] || 0) + 1; });

  const getHint = (w) => {
    if (WORD_HINTS[w.en]) return WORD_HINTS[w.en];
    if (jaCount[w.ja] > 1) return `頭文字は「${w.en[0].toUpperCase()}」`;
    return null;
  };

  const ordered = shuffle([...words]);
  return ordered.map(w => {
    const hint = getHint(w);
    if (mode === 1) {
      const wrong = shuffle(words.filter(x => x.en !== w.en)).slice(0,3).map(x => x.ja);
      return { ...w, hint, display:w.en, correct:w.ja, choices:shuffle([w.ja,...wrong]), qtype:"choice" };
    } else if (mode === 2) {
      const wrong = shuffle(words.filter(x => x.en !== w.en)).slice(0,3).map(x => x.en);
      return { ...w, hint, display:w.ja, correct:w.en, choices:shuffle([w.en,...wrong]), qtype:"choice" };
    } else {
      return { ...w, hint, display:w.ja, correct:w.en, qtype:"typing" };
    }
  });
};

.nav-count{font-family:'BIZ UDGothic',monospace;font-size:12px;color:var(--muted)}
.audio-btn{background:var(--surf2);border:1px solid var(--bord);border-radius:50%;
  width:36px;height:36px;cursor:pointer;font-size:17px;transition:.15s;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;color:var(--cyan)}
.audio-btn:hover{border-color:var(--cyan);box-shadow:0 0 10px rgba(0,229,255,.3)}
.mode-card{background:var(--surf2);border:2px solid var(--bord);border-radius:15px;
  padding:16px 14px;margin-bottom:10px;cursor:pointer;transition:transform .12s,border-color .15s;
  display:flex;align-items:center;gap:12px}
.mode-card:hover{transform:translateX(4px);border-color:rgba(255,255,255,.2)}
.mode-card.cm{border-color:rgba(52,211,153,.4)}
.mode-num{font-family:'BIZ UDGothic',monospace;font-size:20px;font-weight:900;width:38px;text-align:center;flex-shrink:0}
.mode-title{font-weight:700;font-size:14px;margin-bottom:2px}
.mode-desc{font-size:11px;color:var(--muted)}
.mode-aud{font-size:11px;color:var(--cyan);margin-top:3px}
.mode-cl{font-size:11px;color:var(--success);margin-top:3px;font-weight:700}
.q-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.q-prog{font-family:'BIZ UDGothic',monospace;font-size:11px;color:var(--muted)}
.q-timer{font-family:'BIZ UDGothic',monospace;font-size:19px;color:var(--warn)}
.pb-wrap{height:5px;background:var(--surf2);border-radius:3px;overflow:hidden;margin-bottom:14px}
.pb{height:100%;border-radius:3px;transition:width .3s}
.dots-row{display:flex;gap:3px;justify-content:center;margin-bottom:14px}
.qdot{width:8px;height:8px;border-radius:50%;background:var(--surf2);border:1px solid var(--bord);transition:.2s}
.qdot.ok{background:var(--success);border-color:var(--success)}
.qdot.ng{background:var(--danger);border-color:var(--danger)}
.qdot.cur{background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 8px rgba(0,229,255,.6)}
.disp-en{font-family:'BIZ UDGothic',monospace;font-size:clamp(22px,7vw,40px);font-weight:900;
  color:var(--cyan);text-shadow:0 0 24px rgba(0,229,255,.4);text-align:center;
  margin:10px 0 18px;letter-spacing:2px;line-height:1.2}
.disp-ja{font-size:clamp(20px,6vw,32px);font-weight:900;color:var(--txt);text-align:center;margin:10px 0 18px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:14px}
.choice{background:var(--surf2);border:2px solid var(--bord);border-radius:11px;
  padding:15px 8px;font-size:14px;font-weight:700;color:var(--txt);
  cursor:pointer;transition:.15s;text-align:center;font-family:'Noto Sans JP',sans-serif}
.choice:hover:not(:disabled){border-color:var(--cyan);transform:scale(1.02)}
.choice.correct{background:rgba(52,211,153,.2);border-color:var(--success);color:var(--success)}
.choice.wrong{background:rgba(248,113,113,.18);border-color:var(--danger);color:var(--danger)}
.choice:disabled{cursor:default}
.type-area{display:flex;flex-direction:column;gap:9px;margin-bottom:14px}
.type-input{background:var(--surf2);border:2px solid var(--bord);border-radius:12px;
  padding:15px;color:var(--txt);font-size:22px;font-family:'BIZ UDGothic',monospace;font-weight:700;
  text-align:center;letter-spacing:3px;outline:none;transition:.2s;width:100%}
.type-input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,229,255,.15)}
.type-input.c-ok{border-color:var(--success);color:var(--success)}
.type-input.c-ng{border-color:var(--danger);color:var(--danger)}
.reveal{text-align:center;padding:10px;background:rgba(0,0,0,.22);border-radius:10px;margin-top:4px}
.reveal-lbl{font-size:10px;color:var(--muted);letter-spacing:2px;margin-bottom:4px}
.reveal-word{font-family:'BIZ UDGothic',monospace;font-size:20px;font-weight:900;color:var(--cyan)}
.aud-row{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:8px}
.score-big{font-family:'BIZ UDGothic',monospace;font-size:clamp(46px,13vw,68px);font-weight:900;line-height:1}
.score-den{font-size:.38em;color:var(--muted)}
.res-meta{font-size:12px;color:var(--muted);letter-spacing:2px;margin-top:5px}
.res-time{font-family:'BIZ UDGothic',monospace;font-size:19px;color:var(--warn);margin-top:8px}
.res-wpm{font-family:'BIZ UDGothic',monospace;font-size:15px;color:var(--cyan);margin-top:5px}
.cl-announce{background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.4);border-radius:11px;
  padding:9px 14px;text-align:center;color:var(--success);font-weight:700;font-size:13px;margin:10px 0}
.rev-item{background:var(--surf2);border-radius:9px;padding:9px 12px;margin-bottom:6px;
  display:flex;align-items:center;gap:9px;font-size:12px}
.rev-en{font-family:'BIZ UDGothic',monospace;font-weight:700;color:var(--cyan);min-width:80px;font-size:11px}
.rev-ja{font-weight:700;flex:1}
.rev-ok{color:var(--success);font-size:15px;margin-left:auto}
.rev-ng{color:var(--danger);font-size:10px;margin-left:auto;text-align:right;line-height:1.4}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:16px}
.stat-box{background:var(--surf2);border-radius:10px;padding:11px 7px;text-align:center}
.stat-val{font-family:'BIZ UDGothic',monospace;font-size:17px;color:var(--cyan)}
.stat-lbl{font-size:9px;color:var(--muted);margin-top:3px;letter-spacing:1px}
.hist-item{background:var(--surf2);border-left:3px solid var(--cyan);border-radius:9px;
  padding:10px 12px;margin-bottom:7px}
.hist-meta{font-size:10px;color:var(--muted);margin-bottom:4px}
.hist-row{display:flex;align-items:center;gap:10px}
.hist-score{font-family:'BIZ UDGothic',monospace;font-size:14px}
.hist-time{color:var(--warn);font-size:11px}
.hist-wpm{color:var(--cyan);font-size:11px}
.divider{height:1px;background:var(--bord);margin:16px 0}
.back-btn{background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;
  padding:4px 0;margin-bottom:12px;font-family:'Noto Sans JP',sans-serif;transition:.15s;
  display:flex;align-items:center;gap:5px}
.back-btn:hover{color:var(--txt)}
.scroll{max-height:320px;overflow-y:auto;padding-right:3px}
.scroll::-webkit-scrollbar{width:3px}
.scroll::-webkit-scrollbar-track{background:transparent}
.scroll::-webkit-scrollbar-thumb{background:var(--bord);border-radius:2px}
.no-data{text-align:center;color:var(--muted);padding:32px 0;font-size:13px}
.user-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.user-id{font-family:'BIZ UDGothic',monospace;font-size:11px;color:var(--cyan)}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.anim{animation:fadeUp .28s ease both}
`;

// ══════════════════════════════════════════════════════════════════
// APP
// ══════════════════════════════════════════════════════════════════
function App() {
  const [screen, setScreen] = useState("login");
  const [inputId, setInputId] = useState("");
  const [sid, setSid] = useState("");
  const [curStage, setCurStage] = useState(null);
  const [studyIdx, setStudyIdx] = useState(0);
  const [mode, setMode] = useState(null);
  const [qs, setQs] = useState([]);
  const [qi, setQi] = useState(0);
  const [ans, setAns] = useState([]);
  const [chosen, setChosen] = useState(null);
  const [typed, setTyped] = useState("");
  const [typedAll, setTypedAll] = useState([]);
  const [submitted, setSubmitted] = useState(false);
  const [t0, setT0] = useState(null);
  const [elapsed, setElapsed] = useState(0);
  const [db, setDb] = useState(loadDB);
  const tRef = useRef(null);
  const inputRef = useRef(null);

  const udata = db[sid] || { challenges: [], cleared: {} };
  const persist = (next) => {
    const nd = { ...db, [sid]: next };
    setDb(nd); saveDB(nd);
  };

  // Live timer
  useEffect(() => {
    if (screen === "challenge" && t0) {
      tRef.current = setInterval(() => setElapsed(Date.now() - t0), 100);
      return () => clearInterval(tRef.current);
    }
  }, [screen, t0]);

  // Auto-speak mode 1 & 3 on question change
  useEffect(() => {
    if (screen === "challenge" && (mode === 1 || mode === 3) && qs[qi]) speak(qs[qi].en);
  }, [screen, qi, mode, qs]);

  // Focus typing input
  useEffect(() => {
    if (screen === "challenge" && mode === 3 && !submitted) inputRef.current?.focus();
  }, [screen, qi, submitted, mode]);

  const login = () => { if (/^\d{4}$/.test(inputId)) { setSid(inputId); setScreen("stages"); } };
  const goStudy = (s) => { setCurStage(s); setStudyIdx(0); setScreen("study"); };
  const goMenu = () => setScreen("menuSelect");

  const startMode = (m) => {
    const questions = mkQs(curStage.words, m);
    setMode(m); setQs(questions); setQi(0); setAns([]); setChosen(null);
    setTyped(""); setTypedAll([]); setSubmitted(false);
    setT0(Date.now()); setElapsed(0);
    setScreen("challenge");
  };

  const onChoice = (c) => {
    if (chosen) return;
    const q = qs[qi];
    const ok = c === q.correct;
    setChosen(c);
    const newA = [...ans, { en:q.en, ja:q.ja, correct:q.correct, chosen:c, ok }];
    setTimeout(() => {
      if (qi + 1 >= qs.length) finish(newA, null);
      else { setAns(newA); setQi(qi + 1); setChosen(null); }
    }, 750);
  };

  const onTypingSubmit = () => {
    if (submitted) return;
    const q = qs[qi];
    const ok = typed.trim().toLowerCase() === q.correct.toLowerCase();
    setSubmitted(true);
    const nt = [...typedAll, typed.trim()];
    setTypedAll(nt);
    const newA = [...ans, { en:q.en, ja:q.ja, correct:q.correct, chosen:typed.trim(), ok }];
    setTimeout(() => {
      if (qi + 1 >= qs.length) finish(newA, nt);
      else { setAns(newA); setQi(qi + 1); setTyped(""); setSubmitted(false); }
    }, 1300);
  };

  const finish = (finalAns, ta) => {
    clearInterval(tRef.current);
    const time = Date.now() - t0;
    const score = finalAns.filter(a => a.ok).length;
    const total = curStage.words.length;
    let wpm = null;
    if (mode === 3 && ta) {
      const chars = ta.reduce((s, t) => s + t.length, 0);
      wpm = calcWPM(chars, time);
    }
    const nc = { ...udata.cleared };
    if (!nc[curStage.id]) nc[curStage.id] = {};
    if (score === total) nc[curStage.id][`m${mode}`] = true;
    const rec = { stageId:curStage.id, stageTheme:curStage.theme, mode, score, total, time, wpm, date:new Date().toLocaleString("ja-JP") };
    persist({ challenges:[rec,...udata.challenges].slice(0,100), cleared:nc });
    setAns(finalAns); setElapsed(time);
    setScreen("results");
  };

  const isClear = (id) => { const c = udata.cleared[id]; return !!(c && c.m1 && c.m2 && c.m3); };
  const modeCleared = (id, m) => !!(udata.cleared[id]?.[`m${m}`]);
  const totalCleared = STAGES.filter(s => isClear(s.id)).length;
  const score = ans.filter(a => a.ok).length;
  const scoreColor = score >= 8 ? "var(--success)" : score >= 5 ? "var(--warn)" : "var(--danger)";

  return (
    <>
      <style>{css}</style>
      <div className="app">

        {/* ── LOGIN ─────────────────────────────────────────────── */}
        {screen === "login" && (
          <div className="card anim" style={{marginTop:64}}>
            <div className="logo">SPEED英単語</div>
            <div className="sub">スピード英単語チャレンジ</div>
            <div className="sec-title">生徒番号でログイン</div>
            <input className="pin-input" type="number" placeholder="0000" maxLength={4}
              value={inputId} onChange={e => setInputId(e.target.value.slice(0,4))}
              onKeyDown={e => e.key==="Enter" && login()} />
            <button className="btn btn-cyan" onClick={login} disabled={!/^\d{4}$/.test(inputId)}>
              スタート ⚡
            </button>
            <p style={{textAlign:"center",marginTop:12,fontSize:11,color:"var(--muted)"}}>
              ※ 4桁の生徒番号を入力してください
            </p>
          </div>
        )}

        {/* ── STAGES ────────────────────────────────────────────── */}
        {screen === "stages" && (
          <div className="card anim" style={{marginTop:16}}>
            <div className="user-row">
              <div>
                <div className="user-id">ID: {sid}</div>
                <div className="logo" style={{fontSize:17,textAlign:"left"}}>SPEED英単語</div>
              </div>
              <button className="btn btn-ghost btn-sm"
                onClick={()=>{ setSid(""); setInputId(""); setScreen("login"); }}>
                ログアウト
              </button>
            </div>
            <div className="sec-title">ステージを選ぼう！</div>
            <div className="stage-grid">
              {STAGES.map(s => {
                const cl = isClear(s.id);
                return (
                  <div key={s.id} className={`stage-card${cl?" cleared":""}`}
                    style={{borderColor: cl ? "rgba(52,211,153,.45)" : "rgba(255,255,255,.07)"}}
                    onClick={() => goStudy(s)}>
                    {cl && <span className="clear-badge">✅</span>}
                    <div className="stage-emoji">{s.emoji}</div>
                    <div className="stage-num">{s.title}</div>
                    <div className="stage-theme">{s.theme}</div>
                    <div className="mode-dots">
                      {[1,2,3].map(m => (
                        <div key={m} className={`mode-dot${modeCleared(s.id,m)?" on":""}`} />
                      ))}
                    </div>
                  </div>
                );
              })}
            </div>
            <div className="divider" />
            <button className="btn btn-ghost" onClick={() => setScreen("history")}>
              📊 学習記録を見る
            </button>
          </div>
        )}

        {/* ── STUDY ─────────────────────────────────────────────── */}
        {screen === "study" && curStage && (
          <div className="card anim">
            <button className="back-btn" onClick={() => setScreen("stages")}>← ステージ選択に戻る</button>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
              <div>
                <div style={{fontFamily:"'BIZ UDGothic', monospace",fontSize:10,color:"var(--muted)"}}>STAGE {curStage.id}</div>
                <div style={{fontFamily:"'Dela Gothic One',sans-serif",fontSize:15,color:"var(--cyan)"}}>{curStage.theme}</div>
              </div>
              <div style={{fontFamily:"'BIZ UDGothic', monospace",fontSize:11,color:"var(--muted)"}}>{curStage.words.length}単語</div>
            </div>

            <div style={{maxHeight:"54vh",overflowY:"auto",paddingRight:4,marginBottom:14}}>
              {curStage.words.map((w, i) => (
                <div key={i} style={{
                  background:"var(--surface2)",border:"1px solid var(--border)",
                  borderRadius:13,padding:"12px 14px",marginBottom:8,
                  borderLeft:"3px solid var(--cyan)",
                }}>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
                    <span style={{fontFamily:"'BIZ UDGothic', monospace",fontSize:11,color:"var(--muted)",minWidth:18}}>{i+1}.</span>
                    <span style={{fontFamily:"'BIZ UDGothic', monospace",fontSize:17,fontWeight:900,color:"var(--cyan)",letterSpacing:1}}>{w.en}</span>
                    <button className="audio-btn" style={{width:28,height:28,fontSize:13,marginLeft:2}} onClick={()=>speak(w.en)}>🔊</button>
                    <span style={{fontSize:15,fontWeight:900,color:"var(--text)",marginLeft:4}}>{w.ja}</span>
                  </div>
                  {w.ex && (
                    <div style={{background:"var(--surface3)",borderRadius:8,padding:"8px 10px",marginLeft:26}}>
                      <div style={{fontSize:12,color:"var(--text)",fontStyle:"italic",fontWeight:700,marginBottom:2}}>{w.ex}</div>
                      <div style={{fontSize:11,color:"var(--muted)"}}>{w.exJa}</div>
                    </div>
                  )}
                </div>
              ))}
            </div>

            <button className="btn btn-cyan" onClick={goMenu}>チャレンジ開始 🎮</button>
          </div>
        )}

        {/* ── MENU SELECT ───────────────────────────────────────── */}
        {screen === "menuSelect" && curStage && (
          <div className="card anim">
            <button className="back-btn" onClick={() => setScreen("study")}>← 学習に戻る</button>
            <div style={{textAlign:"center",marginBottom:4}}>
              <div style={{fontFamily:"'BIZ UDGothic', monospace",fontSize:10,color:"var(--muted)"}}>STAGE {curStage.id}</div>
              <div style={{fontFamily:"'Dela Gothic One',sans-serif",fontSize:16,color:"var(--cyan)"}}>{curStage.theme}</div>
            </div>
            <div className="sub" style={{marginBottom:18}}>学習メニューを選ぼう</div>
            {[
              {m:1, icon:"🇬🇧", title:"英語→日本語　意味選択", desc:"英単語を見て正しい日本語を選ぶ", aud:"🔊 英単語の音声が流れます"},
              {m:2, icon:"🇯🇵", title:"日本語→英語　単語選択", desc:"日本語を見て正しい英単語を選ぶ", aud:null},
              {m:3, icon:"⌨️",  title:"日本語→英語　タイピング", desc:"日本語を見て英単語を入力する", aud:"🔊 正解時に英単語の音声が流れます"},
            ].map(({m,icon,title,desc,aud}) => {
              const cl = modeCleared(curStage.id, m);
              return (
                <div key={m} className={`mode-card${cl?" cm":""}`} onClick={() => startMode(m)}>
                  <div className="mode-num" style={{color: cl ? "var(--success)" : "var(--cyan)"}}>{icon}</div>
                  <div style={{flex:1}}>
                    <div className="mode-title">{title}</div>
                    <div className="mode-desc">{desc}</div>
                    {aud && <div className="mode-aud">{aud}</div>}
                    {cl && <div className="mode-cl">✅ クリア済み</div>}
                  </div>
                  <span style={{color:"var(--muted)",fontSize:17}}>›</span>
                </div>
              );
            })}
          </div>
        )}

        {/* ── CHALLENGE ─────────────────────────────────────────── */}
        {screen === "challenge" && qs.length > 0 && (() => {
          const q = qs[qi];
          const mColors = {1:"var(--cyan)",2:"var(--orange)",3:"var(--warn)"};
          const mLabels = {1:"英→日 選択",2:"日→英 選択",3:"日→英 タイピング"};
          const isTyping = mode === 3;
          const typedOk = typed.trim().toLowerCase() === q.correct.toLowerCase();
          return (
            <div className="card anim">
              <div className="q-header">
                <div>
                  <div style={{fontSize:9,color:"var(--muted)",letterSpacing:2}}>S{curStage?.id} ─ {mLabels[mode]}</div>
                  <div className="q-prog">Q {qi+1} / {qs.length}</div>
                </div>
                <div className="q-timer">{fmtTime(elapsed)}</div>
              </div>
              <div className="pb-wrap">
                <div className="pb" style={{width:`${(qi/qs.length)*100}%`,background:mColors[mode]}} />
              </div>
              <div className="dots-row">
                {qs.map((_,i) => {
                  let cls = "qdot";
                  if (i < ans.length) cls += ans[i].ok ? " ok" : " ng";
                  else if (i === qi) cls += " cur";
                  return <div key={i} className={cls} />;
                })}
              </div>

              {/* MODE 1 */}
              {mode === 1 && (
                <>
                  <div className="aud-row">
                    <div className="disp-en">{q.en}</div>
                    <button className="audio-btn" onClick={()=>speak(q.en)}>🔊</button>
                  </div>
                  <div style={{textAlign:"center",fontSize:11,color:"var(--muted)",letterSpacing:2,marginBottom:12}}>
                    日本語の意味は？
                  </div>
                  <div className="choices">
                    {q.choices.map((c,i) => {
                      let cls = "choice";
                      if (chosen !== null) {
                        if (c === q.correct) cls += " correct";
                        else if (c === chosen) cls += " wrong";
                      }
                      return <button key={i} className={cls} onClick={()=>onChoice(c)} disabled={chosen!==null}>{c}</button>;
                    })}
                  </div>
                </>
              )}

              {/* MODE 2 */}
              {mode === 2 && (
                <>
                  <div className="disp-ja">{q.ja}</div>
                  {q.hint && (
                    <div style={{textAlign:"center",fontSize:12,color:"var(--warn)",marginBottom:4,letterSpacing:0.5}}>
                      💡 ヒント：{q.hint}
                    </div>
                  )}
                  <div style={{textAlign:"center",fontSize:11,color:"var(--muted)",letterSpacing:2,marginBottom:12}}>
                    英単語はどれ？
                  </div>
                  <div className="choices">
                    {q.choices.map((c,i) => {
                      let cls = "choice";
                      if (chosen !== null) {
                        if (c === q.correct) cls += " correct";
                        else if (c === chosen) cls += " wrong";
                      }
                      return (
                        <button key={i} className={cls} onClick={()=>onChoice(c)} disabled={chosen!==null}
                          style={{fontFamily:"'BIZ UDGothic', monospace",fontSize:12}}>
                          {c}
                        </button>
                      );
                    })}
                  </div>
                </>
              )}

              {/* MODE 3 */}
              {mode === 3 && (
                <>
                  <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:10,marginBottom:4}}>
                    <div className="disp-ja" style={{marginBottom:0}}>{q.ja}</div>
                    <button className="audio-btn" onClick={()=>speak(q.en)}>🔊</button>
                  </div>
                  {q.hint && (
                    <div style={{textAlign:"center",fontSize:12,color:"var(--warn)",marginBottom:4,letterSpacing:0.5}}>
                      💡 ヒント：{q.hint}
                    </div>
                  )}
                  <div style={{textAlign:"center",fontSize:11,color:"var(--muted)",letterSpacing:2,marginBottom:10}}>
                    英単語を入力しよう
                  </div>
                  <div className="type-area">
                    <input ref={inputRef}
                      className={`type-input${submitted ? (typedOk?" c-ok":" c-ng") : ""}`}
                      value={typed}
                      onChange={e => !submitted && setTyped(e.target.value)}
                      onKeyDown={e => e.key==="Enter" && !submitted && typed.trim() && onTypingSubmit()}
                      placeholder="英単語を入力…"
                      disabled={submitted}
                      autoComplete="off" autoCapitalize="none" spellCheck="false"
                    />
                    {!submitted ? (
                      <button className="btn btn-cyan" onClick={onTypingSubmit} disabled={!typed.trim()}>
                        決定 ↵
                      </button>
                    ) : (
                      <div className="reveal">
                        <div className="reveal-lbl">正解の英単語</div>
                        <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:10}}>
                          <div className="reveal-word">{q.correct}</div>
                          <button className="audio-btn" onClick={()=>speak(q.en)}>🔊</button>
                        </div>
                      </div>
                    )}
                  </div>
                </>
              )}
            </div>
          );
        })()}

        {/* ── RESULTS ───────────────────────────────────────────── */}
        {screen === "results" && (
          <div className="card anim">
            <div style={{textAlign:"center",marginBottom:4}}>
              <div style={{fontFamily:"'Dela Gothic One',sans-serif",fontSize:12,color:"var(--muted)",letterSpacing:4}}>RESULT</div>
              <div style={{fontSize:11,color:"var(--muted)",marginTop:2}}>
                STAGE {curStage?.id} {curStage?.theme} ─ モード{mode}
              </div>
            </div>
            <div style={{textAlign:"center",margin:"14px 0"}}>
              <div className="score-big" style={{color:scoreColor}}>
                {score}<span className="score-den">/{curStage?.words?.length||9}</span>
              </div>
              <div className="res-meta">正解率 {curStage?.words?.length ? Math.round(score/curStage.words.length*100) : 0}% ({score}/{curStage?.words?.length||9}問)</div>
              <div style={{fontSize:22,letterSpacing:5,margin:"6px 0"}}>
                {(()=>{const t=curStage?.words?.length||9;return score===t?"⭐⭐⭐":score>=Math.ceil(t*0.8)?"⭐⭐":score>=Math.ceil(t*0.6)?"⭐":"";})()}
              </div>
              <div className="res-time">⏱ {fmtTime(elapsed)}</div>
              {mode===3 && udata.challenges[0]?.wpm != null && (
                <div className="res-wpm">⌨️ {udata.challenges[0].wpm} WPM</div>
              )}
            </div>
            {score === (curStage?.words?.length||9) && (
              <div className="cl-announce">
                ✅ モード{mode} クリア！
                {modeCleared(curStage?.id,1) && modeCleared(curStage?.id,2) && modeCleared(curStage?.id,3) && (
                  <div style={{marginTop:3,fontSize:15}}>🏆 ステージ{curStage?.id} 完全クリア！</div>
                )}
              </div>
            )}
            <div className="divider" />
            <div style={{fontFamily:"'Dela Gothic One',sans-serif",fontSize:13,marginBottom:8}}>見直しリスト</div>
            <div className="scroll" style={{marginBottom:12}}>
              {ans.map((a,i) => (
                <div key={i} className="rev-item">
                  <span className="rev-en">{a.en}</span>
                  <span className="rev-ja">{a.ja}</span>
                  {a.ok
                    ? <span className="rev-ok">✓</span>
                    : <span className="rev-ng">✗ → <span style={{color:"var(--success)",fontFamily:"'BIZ UDGothic', monospace",fontSize:10}}>{a.correct}</span></span>
                  }
                </div>
              ))}
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7,marginBottom:7}}>
              <button className="btn btn-ghost" onClick={()=>startMode(mode)}>🔄 もう一度</button>
              <button className="btn btn-ghost" onClick={()=>setScreen("menuSelect")}>📋 メニューへ</button>
            </div>
            <button className="btn btn-cyan" onClick={()=>setScreen("stages")}>🏠 ステージ選択</button>
          </div>
        )}

        {/* ── HISTORY ───────────────────────────────────────────── */}
        {screen === "history" && (
          <div className="card anim">
            <button className="back-btn" onClick={()=>setScreen("stages")}>← もどる</button>
            <div className="logo" style={{fontSize:17,marginBottom:4}}>📊 学習記録</div>
            <div className="sub">ID: {sid}</div>

            <div className="stat-grid">
              <div className="stat-box">
                <div className="stat-val">{udata.challenges.length}</div>
                <div className="stat-lbl">チャレンジ数</div>
              </div>
              <div className="stat-box">
                <div className="stat-val" style={{color:"var(--success)"}}>{totalCleared}</div>
                <div className="stat-lbl">クリア S数</div>
              </div>
              <div className="stat-box">
                <div className="stat-val">
                  {(() => {
                    const t = udata.challenges.filter(c => c.wpm != null);
                    return t.length > 0 ? Math.round(t.reduce((s,c)=>s+c.wpm,0)/t.length) : "--";
                  })()}
                </div>
                <div className="stat-lbl">平均 WPM</div>
              </div>
            </div>

            {/* stage map */}
            <div style={{fontSize:12,color:"var(--muted)",marginBottom:7,fontWeight:700}}>ステージ達成状況</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:5,marginBottom:14}}>
              {STAGES.map(s => (
                <div key={s.id} style={{
                  background:"var(--surf2)",borderRadius:8,padding:"7px 4px",textAlign:"center",
                  border:`1px solid ${isClear(s.id)?"rgba(52,211,153,.4)":"var(--bord)"}`
                }}>
                  <div style={{fontFamily:"'BIZ UDGothic', monospace",fontSize:9,color:"var(--muted)"}}>S{s.id}</div>
                  {isClear(s.id)
                    ? <div style={{fontSize:14,marginTop:2}}>⭐</div>
                    : <div style={{display:"flex",gap:2,justifyContent:"center",marginTop:4}}>
                        {[1,2,3].map(m=>(
                          <div key={m} style={{width:5,height:5,borderRadius:"50%",
                            background:modeCleared(s.id,m)?"var(--success)":"var(--surf)",
                            border:"1px solid rgba(255,255,255,.14)"}} />
                        ))}
                      </div>
                  }
                </div>
              ))}
            </div>

            <div className="divider" />
            <div style={{fontSize:12,color:"var(--muted)",marginBottom:8,fontWeight:700}}>最近のチャレンジ</div>
            {udata.challenges.length === 0
              ? <div className="no-data">まだ記録がありません。<br/>チャレンジしてみよう！</div>
              : (
                <div className="scroll">
                  {udata.challenges.slice(0,30).map((r,i) => {
                    const rc = r.score >= 8 ? "var(--success)" : r.score >= 5 ? "var(--warn)" : "var(--danger)";
                    const mLabel = ["","英→日","日→英","タイピング"][r.mode] || "";
                    const stg = STAGES.find(s=>s.id===r.stageId);
                    return (
                      <div key={i} className="hist-item" style={{borderLeftColor:stg?.col||"var(--cyan)"}}>
                        <div className="hist-meta">{r.date} ｜ S{r.stageId} {r.stageTheme} [{mLabel}]</div>
                        <div className="hist-row">
                          <span className="hist-score" style={{color:rc}}>{r.score}/9</span>
                          <span className="hist-time">⏱ {fmtTime(r.time)}</span>
                          {r.wpm != null && <span className="hist-wpm">⌨️ {r.wpm}WPM</span>}
                          <span style={{marginLeft:"auto",fontSize:13}}>
                            {(()=>{const t=r.total||9;return r.score===t?"⭐⭐⭐":r.score>=Math.ceil(t*0.8)?"⭐⭐":r.score>=Math.ceil(t*0.6)?"⭐":""})()}
                          </span>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )
            }
          </div>
        )}

      </div>
    </>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
